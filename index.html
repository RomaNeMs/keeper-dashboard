<script type="text/babel">
// quotes.jsx — Inspirational quotes, daily rotation
function Quotes() {
  const [state, setState] = useStore();
  const undo = useUndo();
  const [draftText, setDraftText] = React.useState('');
  const [draftAuthor, setDraftAuthor] = React.useState('');
  const [showAdd, setShowAdd] = React.useState(false);
  const [editingId, setEditingId] = React.useState(null);
  const initialIdx = new Date().getDate() % (state.quotes.length || 1);
  const [focusId, setFocusId] = React.useState(state.quotes[initialIdx]?.id || state.quotes[0]?.id);

  const featured = state.quotes.find(q => q.id === focusId) || state.quotes[0];

  function startEdit(q) {
    setDraftText(q.text);
    setDraftAuthor(q.author);
    setEditingId(q.id);
    setShowAdd(true);
  }
  function closeModal() {
    setShowAdd(false);
    setEditingId(null);
    setDraftText('');
    setDraftAuthor('');
  }
  function add() {
    const text = draftText.trim();
    if (!text) return;
    const author = draftAuthor.trim() || 'Unknown';
    if (editingId) {
      setState(s => ({ ...s, quotes: s.quotes.map(q => q.id === editingId ? { ...q, text, author } : q) }));
      setFocusId(editingId);
    } else {
      const q = { id: uid(), text, author };
      setState(s => ({ ...s, quotes: [q, ...s.quotes] }));
      setFocusId(q.id);
    }
    closeModal();
  }
  function remove(id) {
    const idx = state.quotes.findIndex(q => q.id === id);
    const removed = state.quotes[idx];
    setState(s => ({ ...s, quotes: s.quotes.filter(q => q.id !== id) }));
    if (removed && undo) {
      undo('Quote deleted', () => setState(s => {
        const quotes = [...s.quotes];
        quotes.splice(Math.min(idx, quotes.length), 0, removed);
        return { ...s, quotes };
      }));
    }
  }
  function next() {
    const idx = state.quotes.findIndex(q => q.id === focusId);
    setFocusId(state.quotes[(idx + 1) % state.quotes.length]?.id);
  }
  function shuffle() {
    setFocusId(state.quotes[Math.floor(Math.random() * state.quotes.length)]?.id);
  }
  function reorder(next) {
    setState(s => ({ ...s, quotes: next }));
  }

  const { getHandleProps, dragState } = useReorder(state.quotes, reorder);

  return (
    <div className="main-inner">
      <div className="page-head">
        <div>
          <h2>Quotes</h2>
          <div className="sub">{state.quotes.length} saved · one rotates daily on home</div>
        </div>
        <button className="btn dark" onClick={() => setShowAdd(true)}>+ Add a Quote</button>
      </div>

      {showAdd && (
        <div className="modal-overlay" onClick={closeModal}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3>{editingId ? 'Edit quote' : 'Add a quote'}</h3>
            <div style={{ display: 'grid', gap: 10 }}>
              <textarea
                autoFocus
                className="input"
                placeholder="The quote…"
                value={draftText}
                onChange={(e) => setDraftText(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter' && e.metaKey) add(); }}
                style={{ minHeight: 80, fontFamily: 'var(--font-display)', fontSize: 18, resize: 'vertical' }}
              />
              <input
                className="input"
                placeholder="Author"
                value={draftAuthor}
                onChange={(e) => setDraftAuthor(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') add(); }}
              />
            </div>
            <div className="modal-actions">
              <button className="btn ghost" onClick={closeModal}>Cancel</button>
              <button className="btn dark" disabled={!draftText.trim()} onClick={add}>Save</button>
            </div>
          </div>
        </div>
      )}

      {featured && (
        <div className="quotes-stage">
          <span className="quote-mark">"</span>
          <span className="quote-mark r">"</span>
          <div className="quote-text" dir={isRTL(featured.text) ? 'rtl' : 'ltr'}>
            {featured.text}
          </div>
          <div className="quote-attrib">— {featured.author}</div>
          <div className="quote-bar">
            <button className="btn" onClick={shuffle}>↺ Shuffle</button>
            <button className="btn" onClick={next}>Next →</button>
            <button className="btn" onClick={() => startEdit(featured)}>✎ Edit</button>
          </div>
        </div>
      )}

      <div className="quote-list">
        {state.quotes.map((q, i) => {
          const isDragging = dragState.draggingId === q.id;
          const isOver = dragState.overId === q.id && !isDragging;
          const overBelow = isOver && state.quotes.findIndex(x => x.id === q.id) > state.quotes.findIndex(x => x.id === dragState.draggingId);
          return (
            <div
              key={q.id}
              data-reorder-id={q.id}
              className={[
                'quote-chip',
                isDragging ? 'reorder-dragging' : '',
                isOver ? `reorder-over ${overBelow ? 'reorder-over-below' : ''}` : '',
              ].filter(Boolean).join(' ')}
              style={{ background: CAT_COLOR_BG[NOTE_COLORS[i % NOTE_COLORS.length]] }}
              onClick={() => setFocusId(q.id)}
            >
              <span className="reorder-handle quote-chip-handle" {...getHandleProps(q.id)} title="Drag to reorder">⠿</span>
              <span dir={isRTL(q.text) ? 'rtl' : 'ltr'}>"{q.text}"</span>
              <span className="qa">— {q.author}
                <span style={{ float: 'right', cursor: 'pointer', fontSize: 13, lineHeight: 1 }} title="Delete"
                  onClick={(e) => { e.stopPropagation(); remove(q.id); }}>×</span>
                <span style={{ float: 'right', cursor: 'pointer', marginRight: 12 }} title="Edit"
                  onClick={(e) => { e.stopPropagation(); startEdit(q); }}>✎</span>
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

Object.assign(window, { Quotes });

</script>
<!-- trips.jsx -->
<script type="text/babel">
// trips.jsx — Vacation & trip expense tracker
const TRIP_CATEGORIES = [
  { id: 'flight',    label: 'Flight',    icon: '✈️' },
  { id: 'hotel',     label: 'Hotel',     icon: '🏨' },
  { id: 'insurance', label: 'Insurance', icon: '🛡️' },
  { id: 'car',       label: 'Car',       icon: '🚗' },
  { id: 'train',     label: 'Train',     icon: '🚂' },
  { id: 'food',      label: 'Food',      icon: '🍽️' },
  { id: 'shopping',  label: 'Shopping',  icon: '🛍️' },
  { id: 'other',     label: 'Other',     icon: '📦' },
];
const TRIP_CURRENCIES = ['USD', 'EUR', 'ILS'];

// Category accent colors — deep tones from the app palette
const TRIP_CAT_COLORS = {
  flight:    '#0066CC',
  hotel:     '#7A57C0',
  insurance: '#46708E',
  car:       '#7a5c3a',
  train:     '#B5622B',
  food:      '#2E7D52',
  shopping:  '#B94040',
  other:     '#8a7060',
};

function tripDays(trip) {
  if (!trip.startDate || !trip.endDate) return 0;
  const d = Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000) + 1;
  return d > 0 ? d : 0;
}

// Aggregate expenses of one or more trips into per-category ILS totals
function catTotalsILS(trips) {
  const totals = {};
  let grand = 0;
  trips.forEach(t => (t.expenses || []).forEach(e => {
    const ils = toILSamt(e, t);
    const c = TRIP_CAT_COLORS[e.category] ? e.category : 'other';
    if (!totals[c]) totals[c] = { amount: 0, count: 0 };
    totals[c].amount += ils;
    totals[c].count += 1;
    grand += ils;
  }));
  return { totals, grand };
}

// Stacked bar + per-category rows (icon · label · count · % · ₪)
function CatBreakdown({ trips }) {
  const { totals, grand } = catTotalsILS(trips);
  if (!grand) return null;
  const cats = TRIP_CATEGORIES
    .filter(c => totals[c.id])
    .sort((a, b) => totals[b.id].amount - totals[a.id].amount);
  return (
    <div className="cat-breakdown">
      <div className="cat-bar">
        {cats.map(c => (
          <div key={c.id} className="cat-bar-seg"
            style={{ width: `${(totals[c.id].amount / grand) * 100}%`, background: TRIP_CAT_COLORS[c.id] }} />
        ))}
      </div>
      <div className="cat-rows">
        {cats.map(c => {
          const t = totals[c.id];
          return (
            <div key={c.id} className="cat-row">
              <span className="cat-row-dot" style={{ background: TRIP_CAT_COLORS[c.id] }} />
              <span className="cat-row-icon">{c.icon}</span>
              <span className="cat-row-label">{c.label}</span>
              <span className="cat-row-count">
                ×{t.count}{t.count > 1 ? ` · avg ${fmtILS(t.amount / t.count)}` : ''}
              </span>
              <span className="cat-row-pct">{Math.round((t.amount / grand) * 100)}%</span>
              <span className="cat-row-amt">{fmtILS(t.amount)}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Lifetime summary across all trips + statistics
function TripsOverview({ trips, open, onToggle }) {
  const { grand } = catTotalsILS(trips);
  if (!grand) return null;

  const nExp = trips.reduce((n, t) => n + (t.expenses || []).length, 0);
  const ranked = trips.map(t => ({ t, total: totalILS(t) })).sort((a, b) => b.total - a.total);
  const top = ranked[0];
  const avg = grand / trips.length;

  let biggest = null;
  trips.forEach(t => (t.expenses || []).forEach(e => {
    const ils = toILSamt(e, t);
    if (!biggest || ils > biggest.ils) biggest = { e, ils, trip: t };
  }));
  const biggestCat = biggest && TRIP_CATEGORIES.find(c => c.id === biggest.e.category);

  return (
    <div className="trips-overview">
      <div className="trips-overview-head" onClick={onToggle}>
        <div>
          <div className="block-label">All trips · lifetime</div>
          <div className="trips-overview-total">{fmtILS(grand)}</div>
          <div className="trips-overview-sub">
            {trips.length} trips · {nExp} expenses · avg {fmtILS(avg)} per trip
          </div>
        </div>
        <button className="trip-collapse-btn">{open ? '▲' : '▼'}</button>
      </div>
      {open && (
        <>
          <CatBreakdown trips={trips} />
          <div className="trips-overview-stats">
            <div className="tstat">
              <span>Most expensive trip</span>
              <b>{top.t.name} · {fmtILS(top.total)}</b>
            </div>
            {biggest && (
              <div className="tstat">
                <span>Biggest single expense</span>
                <b>{biggest.e.description || biggestCat?.label || 'Expense'} · {fmtILS(biggest.ils)}</b>
              </div>
            )}
            <div className="tstat">
              <span>Average per trip</span>
              <b>{fmtILS(avg)}</b>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function totalILS(trip) {
  return trip.expenses.reduce((sum, e) => {
    if (e.currency === 'ILS') return sum + e.amount;
    if (e.currency === 'USD') return sum + e.amount * (trip.usdRate || 3.7);
    if (e.currency === 'EUR') return sum + e.amount * (trip.eurRate || 3.9);
    return sum + e.amount;
  }, 0);
}

function toILSamt(e, trip) {
  if (e.currency === 'ILS') return e.amount;
  if (e.currency === 'USD') return e.amount * (trip.usdRate || 3.7);
  if (e.currency === 'EUR') return e.amount * (trip.eurRate || 3.9);
  return e.amount;
}

function fmtILS(n) {
  return '₪' + Math.round(n).toLocaleString('en-US');
}

function fmtAmt(n, ccy) {
  const s = Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  if (ccy === 'USD') return '$' + s;
  if (ccy === 'EUR') return '€' + s;
  return '₪' + s;
}

function exportCSV(trip) {
  const header = 'Date,Category,Description,Amount,Currency,ILS Equivalent';
  const rows = [...trip.expenses]
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
    .map(e => {
      const cat = TRIP_CATEGORIES.find(c => c.id === e.category)?.label || e.category;
      return [e.date || '', cat, e.description || '', e.amount, e.currency, Math.round(toILSamt(e, trip))].join(',');
    });
  navigator.clipboard.writeText([header, ...rows].join('\n'))
    .then(() => alert('CSV copied!'))
    .catch(() => alert('Copy failed'));
}

// ── Trip actions popover (⋯ menu) ──────────────────────────────────────────
function TripMenu({ trip, onEdit, onDelete, onToggleActive, onExport, onClose }) {
  React.useEffect(() => {
    const handler = (e) => { if (!e.target.closest('.trip-menu-wrap')) onClose(); };
    document.addEventListener('mousedown', handler);
    document.addEventListener('touchstart', handler);
    return () => { document.removeEventListener('mousedown', handler); document.removeEventListener('touchstart', handler); };
  }, [onClose]);

  return (
    <div className="trip-menu-wrap">
      <div className="trip-menu-pop">
        <button className="trip-menu-item" onClick={() => { onEdit(); onClose(); }}>✎ Edit trip</button>
        <button className="trip-menu-item" onClick={() => { onToggleActive(); onClose(); }}>
          {trip.active ? '📦 Mark as past' : '✈️ Set as active'}
        </button>
        <button className="trip-menu-item" onClick={() => { onExport(); onClose(); }}>↗ Export CSV</button>
        <button className="trip-menu-item danger" onClick={() => {
          if (confirm(`Delete "${trip.name}" and all expenses?`)) { onDelete(); onClose(); }
        }}>✕ Delete trip</button>
      </div>
    </div>
  );
}

// ── Swipe-to-reveal expense row ────────────────────────────────────────────
const EXP_SWIPE_OPEN = -104;
const EXP_SWIPE_THRESH = -36;

function ExpenseRow({ expense, trip, handleProps, isDragging, isOver, overBelow, onEdit, onDelete }) {
  const [swipeX, setSwipeX] = React.useState(0);
  const swiping = React.useRef(null);

  function onTouchStart(e) {
    if (e.target.closest('[data-reorder-handle]')) return;
    const t = e.touches[0];
    swiping.current = { startX: t.clientX, startY: t.clientY, openAt: swipeX, locked: null };
  }
  function onTouchMove(e) {
    const st = swiping.current;
    if (!st) return;
    const t = e.touches[0];
    const dx = t.clientX - st.startX, dy = t.clientY - st.startY;
    if (st.locked === null) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      st.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (st.locked !== 'x') return;
    e.preventDefault();
    setSwipeX(Math.min(0, Math.max(EXP_SWIPE_OPEN, st.openAt + dx)));
  }
  function onTouchEnd() {
    const st = swiping.current; swiping.current = null;
    if (!st || st.locked !== 'x') return;
    setSwipeX(swipeX <= EXP_SWIPE_THRESH ? EXP_SWIPE_OPEN : 0);
  }
  function close() { setSwipeX(0); }

  const cat = TRIP_CATEGORIES.find(c => c.id === expense.category);
  const ils = toILSamt(expense, trip);

  const rowCls = [
    'trip-expense-row-wrap',
    isDragging ? 'reorder-dragging' : '',
    isOver ? `reorder-over ${overBelow ? 'reorder-over-below' : ''}` : '',
  ].filter(Boolean).join(' ');

  return (
    <div className={rowCls} data-reorder-id={expense.id}>
      <div className="item-swipe-actions">
        <button className="item-swipe-btn edit" onClick={() => { onEdit(); close(); }}>
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none">
            <path d="M8.5 1.5l2 2-6.5 6.5-2.3.3.3-2.3 6.5-6.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/>
          </svg>
        </button>
        <button className="item-swipe-btn delete" onClick={() => { onDelete(); close(); }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        </button>
      </div>
      <div
        className="trip-expense-body"
        style={{ transform: `translateX(${swipeX}px)` }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        <span className="reorder-handle" {...handleProps} title="Drag to reorder">⠿</span>
        <span className="trip-exp-icon">{cat?.icon || '📦'}</span>
        <div className="trip-exp-main">
          <div className="trip-exp-name">{expense.description || cat?.label || 'Expense'}</div>
          {expense.date && <div className="trip-exp-date">{expense.date}</div>}
        </div>
        <div className="trip-exp-amts">
          <div className="trip-exp-orig">{fmtAmt(expense.amount, expense.currency)}</div>
          {expense.currency !== 'ILS' && <div className="trip-exp-ils">{fmtILS(ils)}</div>}
        </div>
        <button className="item-action-btn edit" onClick={onEdit} title="Edit">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8.5 1.5l2 2-6.5 6.5-2.3.3.3-2.3 6.5-6.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/>
          </svg>
        </button>
        <button className="item-action-btn delete" onClick={onDelete} title="Delete">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

// ── Main Trips component ───────────────────────────────────────────────────
function Trips() {
  const [state, setState] = useStore();
  const trips = state.trips || [];
  const [showNew, setShowNew] = React.useState(false);
  const collapsed = state.tripsCollapsed || {};
  // Default open (true) until the user explicitly collapses it — then remembered
  // across app restarts/devices just like everything else in the synced store.
  const overviewOpen = state.tripsOverviewOpen !== false;

  function toggleCollapse(id) {
    setState(s => ({
      ...s,
      tripsCollapsed: { ...(s.tripsCollapsed || {}), [id]: !(s.tripsCollapsed || {})[id] }
    }));
  }

  function toggleOverviewOpen() {
    setState(s => ({ ...s, tripsOverviewOpen: !(s.tripsOverviewOpen !== false) }));
  }

  function createTrip(name, startDate, endDate, usdRate, eurRate) {
    // Don't auto-archive existing trips — user controls active/past manually
    const trip = {
      id: uid(), name, startDate, endDate,
      usdRate: parseFloat(usdRate) || (state.usdRate || 3.7),
      eurRate: parseFloat(eurRate) || 3.9,
      active: true,
      expenses: [],
      sortIdx: 0,
      createdAt: Date.now(),
    };
    // Shift existing sortIdx down
    setState(s => ({
      ...s,
      trips: [trip, ...(s.trips || []).map((t, i) => ({ ...t, sortIdx: i + 1 }))],
    }));
    setShowNew(false);
  }

  function editTrip(id, name, startDate, endDate) {
    setState(s => ({
      ...s,
      trips: (s.trips || []).map(t => t.id === id ? { ...t, name, startDate, endDate } : t),
    }));
  }

  function toggleActive(id) {
    setState(s => ({
      ...s,
      trips: (s.trips || []).map(t => t.id === id ? { ...t, active: !t.active } : t),
    }));
  }

  function deleteTrip(id) {
    setState(s => ({ ...s, trips: (s.trips || []).filter(t => t.id !== id) }));
  }

  function addExpense(tripId, expense) {
    setState(s => ({
      ...s,
      trips: (s.trips || []).map(t =>
        t.id === tripId ? { ...t, expenses: [...t.expenses, { id: uid(), ...expense, sortIdx: t.expenses.length, createdAt: Date.now() }] } : t
      ),
    }));
  }

  function updateExpense(tripId, expenseId, updates) {
    setState(s => ({
      ...s,
      trips: (s.trips || []).map(t =>
        t.id === tripId ? { ...t, expenses: t.expenses.map(e => e.id === expenseId ? { ...e, ...updates } : e) } : t
      ),
    }));
  }

  function deleteExpense(tripId, expenseId) {
    setState(s => ({
      ...s,
      trips: (s.trips || []).map(t =>
        t.id === tripId ? { ...t, expenses: t.expenses.filter(e => e.id !== expenseId) } : t
      ),
    }));
  }

  function updateRates(tripId, usdRate, eurRate) {
    setState(s => ({
      ...s,
      trips: (s.trips || []).map(t =>
        t.id === tripId ? { ...t, usdRate: parseFloat(usdRate) || t.usdRate, eurRate: parseFloat(eurRate) || t.eurRate } : t
      ),
    }));
  }

  function reorderTrips(next) {
    setState(s => ({ ...s, trips: next.map((t, i) => ({ ...t, sortIdx: i })) }));
  }

  function reorderExpenses(tripId, nextExpenses) {
    setState(s => ({
      ...s,
      trips: (s.trips || []).map(t =>
        t.id === tripId ? { ...t, expenses: nextExpenses.map((e, i) => ({ ...e, sortIdx: i })) } : t
      ),
    }));
  }

  // Sort trips by sortIdx (manual order)
  const sorted = [...trips].sort((a, b) => (a.sortIdx ?? 0) - (b.sortIdx ?? 0));
  const { getHandleProps: getTripHandle, dragState: tripDrag } = useReorder(sorted, reorderTrips);

  const activeCount = trips.filter(t => t.active).length;

  return (
    <div className="main-inner">
      <div className="page-head">
        <div>
          <h2>Trips</h2>
          <div className="sub">{trips.length} trip{trips.length !== 1 ? 's' : ''} · {activeCount} active</div>
        </div>
        <button className="btn dark" onClick={() => setShowNew(true)}>+ New trip</button>
      </div>

      {trips.length >= 2 && (
        <TripsOverview trips={trips} open={overviewOpen} onToggle={toggleOverviewOpen} />
      )}

      {showNew && (
        <NewTripModal
          defaultUsdRate={state.usdRate || 3.7}
          onCreate={createTrip}
          onClose={() => setShowNew(false)}
        />
      )}

      {trips.length === 0 && (
        <div className="card" style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--muted)' }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>✈️</div>
          <div style={{ fontWeight: 600, marginBottom: 6 }}>No trips yet</div>
          <div style={{ fontSize: 13 }}>Tap + New trip to start tracking expenses.</div>
        </div>
      )}

      <div className="trip-list">
        {sorted.map(t => {
          const isDragging = tripDrag.draggingId === t.id;
          const isOver = tripDrag.overId === t.id && !isDragging;
          const overBelow = isOver && sorted.findIndex(x => x.id === t.id) > sorted.findIndex(x => x.id === tripDrag.draggingId);
          return (
            <TripCard
              key={t.id}
              trip={t}
              collapsed={!!collapsed[t.id]}
              onToggleCollapse={() => toggleCollapse(t.id)}
              tripHandleProps={getTripHandle(t.id)}
              isDragging={isDragging}
              isOver={isOver}
              overBelow={overBelow}
              onEdit={(name, s, e) => editTrip(t.id, name, s, e)}
              onToggleActive={() => toggleActive(t.id)}
              onDelete={() => deleteTrip(t.id)}
              onAddExpense={(e) => addExpense(t.id, e)}
              onUpdateExpense={(eid, u) => updateExpense(t.id, eid, u)}
              onDeleteExpense={(eid) => deleteExpense(t.id, eid)}
              onReorderExpenses={(next) => reorderExpenses(t.id, next)}
              onUpdateRates={(u, ev) => updateRates(t.id, u, ev)}
            />
          );
        })}
      </div>
    </div>
  );
}

function TripCard({
  trip, collapsed, onToggleCollapse, tripHandleProps,
  isDragging, isOver, overBelow,
  onEdit, onToggleActive, onDelete,
  onAddExpense, onUpdateExpense, onDeleteExpense, onReorderExpenses, onUpdateRates,
}) {
  const [showAdd, setShowAdd] = React.useState(false);
  const [editingExpense, setEditingExpense] = React.useState(null);
  const [showEditTrip, setShowEditTrip] = React.useState(false);
  const [showMenu, setShowMenu] = React.useState(false);
  const [editRates, setEditRates] = React.useState(false);
  const [draftUSD, setDraftUSD] = React.useState(String(trip.usdRate));
  const [draftEUR, setDraftEUR] = React.useState(String(trip.eurRate));

  const total = totalILS(trip);
  const byCcy = TRIP_CURRENCIES.map(c => ({
    ccy: c,
    amt: trip.expenses.filter(e => e.currency === c).reduce((s, e) => s + e.amount, 0),
  })).filter(x => x.amt > 0);

  // Sort expenses by sortIdx then createdAt
  const sortedExpenses = [...trip.expenses].sort((a, b) =>
    (a.sortIdx ?? 0) - (b.sortIdx ?? 0) || (a.createdAt || 0) - (b.createdAt || 0)
  );
  const { getHandleProps: getExpHandle, dragState: expDrag } = useReorder(sortedExpenses, onReorderExpenses);

  function saveRates() {
    onUpdateRates && onUpdateRates(draftUSD, draftEUR);
    setEditRates(false);
  }

  const cardCls = [
    'trip-card',
    !trip.active ? 'trip-card-past' : '',
    isDragging ? 'reorder-dragging' : '',
    isOver ? `reorder-over ${overBelow ? 'reorder-over-below' : ''}` : '',
  ].filter(Boolean).join(' ');

  return (
    <div className={cardCls} data-reorder-id={trip.id}>
      {/* Header row — always visible */}
      <div className="trip-card-head">
        <span className="reorder-handle trip-drag-handle" {...tripHandleProps} title="Drag to reorder">⠿</span>
        <div className="trip-head-info" onClick={onToggleCollapse} style={{ flex: 1, minWidth: 0, cursor: 'pointer' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span className="trip-name">{trip.name}</span>
            {!trip.active && <span className="trip-badge-past">past</span>}
          </div>
          {(trip.startDate || trip.endDate) && (
            <div className="trip-dates">{trip.startDate}{trip.endDate ? ` - ${trip.endDate}` : ''}</div>
          )}
        </div>
        {/* Compact total always visible */}
        <div className="trip-head-total" onClick={onToggleCollapse} style={{ cursor: 'pointer' }}>
          <span className="trip-head-ils">{fmtILS(total)}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, position: 'relative' }}>
          {!collapsed && (
            <>
              <button className="trip-menu-btn" onClick={() => setShowMenu(m => !m)}>⋯</button>
              {showMenu && (
                <TripMenu
                  trip={trip}
                  onEdit={() => setShowEditTrip(true)}
                  onDelete={onDelete}
                  onToggleActive={onToggleActive}
                  onExport={() => exportCSV(trip)}
                  onClose={() => setShowMenu(false)}
                />
              )}
            </>
          )}
        </div>
        <button className="trip-collapse-btn" onClick={onToggleCollapse}>{collapsed ? '▼' : '▲'}</button>
      </div>

      {!collapsed && (
        <>
          {/* Slim summary bar */}
          <div className="trip-totals">
            <div className="trip-totals-row">
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', flex: 1, minWidth: 0 }}>
                <span className="trip-total-big">{fmtILS(total)}</span>
                {byCcy.map(x => (
                  <span key={x.ccy} className="trip-ccy-pill">{fmtAmt(x.amt, x.ccy)}</span>
                ))}
                {tripDays(trip) > 0 && total > 0 && (
                  <span className="trip-ccy-pill" title="Average per day">
                    {fmtILS(total / tripDays(trip))}/day · {tripDays(trip)}d
                  </span>
                )}
              </div>
              <div className="trip-rates-inline">
                {editRates ? (
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                    <span style={{ fontSize: 10, opacity: 0.6 }}>$</span>
                    <input type="number" value={draftUSD} onChange={e => setDraftUSD(e.target.value)}
                      style={{ width: 44, fontSize: 11, padding: '2px 4px', borderRadius: 4, border: '1px solid rgba(255,255,255,0.3)', background: 'rgba(255,255,255,0.15)', color: 'inherit', outline: 'none' }}/>
                    <span style={{ fontSize: 10, opacity: 0.6 }}>€</span>
                    <input type="number" value={draftEUR} onChange={e => setDraftEUR(e.target.value)}
                      style={{ width: 44, fontSize: 11, padding: '2px 4px', borderRadius: 4, border: '1px solid rgba(255,255,255,0.3)', background: 'rgba(255,255,255,0.15)', color: 'inherit', outline: 'none' }}/>
                    <button onClick={saveRates} style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, border: 'none', background: 'rgba(255,255,255,0.25)', cursor: 'pointer', color: 'inherit' }}>✓</button>
                  </div>
                ) : (
                  <span className="trip-rate-label" onClick={() => { setDraftUSD(String(trip.usdRate)); setDraftEUR(String(trip.eurRate)); setEditRates(true); }}>
                    $→₪{trip.usdRate} · €→₪{trip.eurRate} ✎
                  </span>
                )}
              </div>
            </div>
          </div>

          {/* Per-category breakdown */}
          {sortedExpenses.length > 1 && (
            <div className="trip-cats">
              <CatBreakdown trips={[trip]} />
            </div>
          )}

          {/* Add expense button */}
          <div className="add-col-btn-row">
            <button className="add-col-btn" onClick={() => setShowAdd(true)}>+ Add expense</button>
          </div>

          {/* Expense list */}
          {sortedExpenses.length === 0 ? (
            <div style={{ padding: '12px 14px', color: 'var(--muted)', fontSize: 13 }}>No expenses yet.</div>
          ) : (
            <div className="trip-expenses">
              {sortedExpenses.map(e => {
                const expIsDragging = expDrag.draggingId === e.id;
                const expIsOver = expDrag.overId === e.id && !expIsDragging;
                const expOverBelow = expIsOver && sortedExpenses.findIndex(x => x.id === e.id) > sortedExpenses.findIndex(x => x.id === expDrag.draggingId);
                return (
                  <ExpenseRow
                    key={e.id}
                    expense={e}
                    trip={trip}
                    handleProps={getExpHandle(e.id)}
                    isDragging={expIsDragging}
                    isOver={expIsOver}
                    overBelow={expOverBelow}
                    onEdit={() => setEditingExpense(e)}
                    onDelete={() => onDeleteExpense(e.id)}
                  />
                );
              })}
            </div>
          )}
        </>
      )}

      {showAdd && (
        <AddExpenseModal
          onSave={(exp) => { onAddExpense(exp); setShowAdd(false); }}
          onClose={() => setShowAdd(false)}
        />
      )}
      {editingExpense && (
        <AddExpenseModal
          initial={editingExpense}
          onSave={(updates) => { onUpdateExpense(editingExpense.id, updates); setEditingExpense(null); }}
          onClose={() => setEditingExpense(null)}
        />
      )}
      {showEditTrip && (
        <EditTripModal
          trip={trip}
          onSave={(name, s, e) => { onEdit(name, s, e); setShowEditTrip(false); }}
          onClose={() => setShowEditTrip(false)}
        />
      )}
    </div>
  );
}

function EditTripModal({ trip, onSave, onClose }) {

  const [startDate, setStartDate] = React.useState(trip.startDate || '');

}

function AddExpenseModal({ initial, onSave, onClose }) {
  const [step, setStep] = React.useState(initial ? 2 : 1);
  const [category, setCategory] = React.useState(initial?.category || '');
  const [description, setDescription] = React.useState(initial?.description || '');
  const [amountStr, setAmountStr] = React.useState(() => {
    if (!initial?.amount) return '';
    return Number(initial.amount).toLocaleString('en-US', { maximumFractionDigits: 2 });
  });

  function handleAmountChange(e) {
    const raw = e.target.value;
    // Allow typing: strip commas for parsing, keep decimals
    const stripped = raw.replace(/,/g, '');
    // Only reformat if it's a clean number (no trailing dot)
    if (stripped === '' || stripped === '-') { setAmountStr(raw); return; }
    if (stripped.endsWith('.')) { setAmountStr(stripped); return; }
    const n = parseFloat(stripped);
    if (isNaN(n)) { setAmountStr(raw); return; }
    // Format integer part with commas, preserve decimal if present
    const parts = stripped.split('.');
    const intPart = parseInt(parts[0], 10).toLocaleString('en-US');
    const formatted = parts.length > 1 ? intPart + '.' + parts[1] : intPart;
    setAmountStr(formatted);
  }
  const [currency, setCurrency] = React.useState(initial?.currency || 'USD');
  const [date, setDate] = React.useState(initial?.date || today());

  function submit() {
    // Parse amount — strip commas, spaces
    const amt = parseFloat(amountStr.replace(/,/g, '').replace(/\s/g, ''));
    if (!amt || amt <= 0) return;
    onSave({ category, description: description.trim(), amount: amt, currency, date });
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        {step === 1 ? (
          <>
            <h3>Category</h3>
            <div className="trip-cat-grid">
              {TRIP_CATEGORIES.map(c => (
                <button key={c.id} className={`trip-cat-btn ${category === c.id ? 'active' : ''}`}
                  onClick={() => { setCategory(c.id); setStep(2); }}>
                  <span className="trip-cat-icon">{c.icon}</span>
                  <span className="trip-cat-label">{c.label}</span>
                </button>
              ))}
            </div>
            <div className="modal-actions">
              <button className="btn ghost" onClick={() => initial ? setStep(2) : onClose()}>
                {initial ? '← Back' : 'Cancel'}
              </button>
            </div>
          </>
        ) : (
          <>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
              <button className="exp-cat-chip" onClick={() => setStep(1)} title="Change category">
                <span style={{ fontSize: 17 }}>{TRIP_CATEGORIES.find(c => c.id === category)?.icon || '📦'}</span>
                <span>{TRIP_CATEGORIES.find(c => c.id === category)?.label || 'Category'}</span>
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                  <path d="M8.5 1.5l2 2-6.5 6.5-2.3.3.3-2.3 6.5-6.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/>
                </svg>
              </button>
              {initial && <span style={{ fontWeight: 600, fontSize: 14 }}>Edit expense</span>}
            </div>
            <div style={{ display: 'grid', gap: 8 }}>
              <div>
                <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Amount</div>
                <div className="trip-amount-row">
                  <input
                    autoFocus
                    type="text"
                    inputMode="decimal"
                    className="input input-sm"
                    placeholder="0"
                    value={amountStr}
                    onChange={handleAmountChange}
                    onKeyDown={e => { if (e.key === 'Enter') submit(); }}
                    style={{ flex: 1, minWidth: 0 }}
                  />
                  <div className="trip-ccy-toggle">
                    {TRIP_CURRENCIES.map(c => (
                      <button key={c} className={`trip-ccy-btn ${currency === c ? 'active' : ''}`}
                        onClick={() => setCurrency(c)}>{c}</button>
                    ))}
                  </div>
                </div>
              </div>
              <div>
                <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Description (optional)</div>
                <input className="input input-sm" placeholder="e.g. El Al TLV-HER"
                  value={description} onChange={e => setDescription(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') submit(); }}/>
              </div>
              <div>
                <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>Date</div>
                <input type="date" className="input input-sm" value={date} onChange={e => setDate(e.target.value)}
                  style={{ fontSize: 12, padding: '5px 8px' }}/>
              </div>
            </div>
            <div className="modal-actions" style={{ marginTop: 12 }}>
              <button className="btn ghost" onClick={onClose}>Cancel</button>
              <button className="btn dark"
                disabled={!amountStr || parseFloat(amountStr.replace(/,/g, '')) <= 0}
                onClick={submit}>
                {initial ? 'Save' : 'Add'}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

<script type="text/babel">
// finance.jsx — Family financial snapshot, password-protected
const FIN_LOCK_KEY = 'pdash.fin.unlocked';
const FIN_PASSWORD = '2011';
const FX_KEY = 'pdash.fin.usdRate';
const FIN_CACHE_KEY = 'pdash.fin.data';
const DEFAULT_USD_RATE = 3.7;

function loadRate() {
  try { const v = parseFloat(localStorage.getItem(FX_KEY)); return v > 0 ? v : DEFAULT_USD_RATE; }
  catch { return DEFAULT_USD_RATE; }
}
function saveRate(v) { try { localStorage.setItem(FX_KEY, String(v)); } catch {} }

// Sync availability comes from the store (apiFetch/IS_SYNC on window)

// ───── Empty/placeholder data structure ─────
const EMPTY_FIN = {
  updated: '—',
  cash: [], investments: [], deposits: [], pension: [], rsu: [],
};

function toILS(amt, ccy, rate) { return ccy === 'USD' ? amt * rate : amt; }
function fmtILS(n) {
  const s = Math.round(Math.abs(n)).toLocaleString('en-US');
  return (n < 0 ? '−' : '') + '₪' + s;
}
function fmtUSD(n) {
  const s = Math.round(Math.abs(n)).toLocaleString('en-US');
  return (n < 0 ? '−' : '') + '$' + s;
}
function fmtCcy(n, ccy) { return ccy === 'USD' ? fmtUSD(n) : fmtILS(n); }

// ───── Lock screen ─────
function FinanceLock({ onUnlock }) {
  const [pw, setPw] = React.useState('');
  const [err, setErr] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => { ref.current && ref.current.focus(); }, []);
  function submit(e) {
    e && e.preventDefault();
    if (pw === FIN_PASSWORD) onUnlock();
    else { setErr(true); setPw(''); setTimeout(() => setErr(false), 600); }
  }
  return (
    <div className="main-inner" style={{ display: 'grid', placeItems: 'center', minHeight: 'calc(100vh - 200px)' }}>
      <form onSubmit={submit} className={`fin-lock ${err ? 'shake' : ''}`}>
        <div className="fin-lock-art">
          <div className="fin-lock-shackle" />
          <div className="fin-lock-body">
            <div className="fin-lock-keyhole" />
          </div>
        </div>
        <h2>Finance</h2>
        <p>This tab is private. Enter your passcode to view family financials.</p>
        <input
          ref={ref}
          type="password"
          inputMode="numeric"
          placeholder="• • • •"
          value={pw}
          onChange={(e) => setPw(e.target.value)}
          className={err ? 'err' : ''}
        />
        <button className="btn dark" type="submit">Unlock →</button>
        <div className="fin-lock-hint">Auto-locks when you leave the tab.</div>
      </form>
    </div>
  );
}

// ───── Main view ─────
function Finance() {
  const [state, setState] = useStore();
  const [hide, setHide] = React.useState(false);
  // Rate stored in state.usdRate so it syncs via Sheet to all devices
  const rate = state.usdRate || 3.7;
  const [editingRate, setEditingRate] = React.useState(false);
  const [draftRate, setDraftRate] = React.useState(String(rate));
  const [finData, setFinData] = React.useState(() => {
    try {
      const cached = localStorage.getItem(FIN_CACHE_KEY);
      return cached ? JSON.parse(cached) : EMPTY_FIN;
    } catch { return EMPTY_FIN; }
  });
  const [syncStatus, setSyncStatus] = React.useState('idle');

  function commitRate() {
    const v = parseFloat(draftRate);
    if (v > 0 && v < 100) {
      setState(s => ({ ...s, usdRate: v }));
    } else {
      setDraftRate(String(rate));
    }
    setEditingRate(false);
  }

  function syncFromSheet() {
    if (!window.IS_SYNC) {
      setSyncStatus('error');
      setTimeout(() => setSyncStatus('idle'), 2000);
      return;
    }
    setSyncStatus('loading');
    apiFetch('getFinanceData')
      .then(json => {
        const data = json && json !== 'null' ? JSON.parse(json) : null;
        if (!data) { setSyncStatus('error'); return; }
        setFinData(data);
        localStorage.setItem(FIN_CACHE_KEY, JSON.stringify(data));
        setSyncStatus('idle');
      })
      .catch(() => setSyncStatus('error'));
  }

  // Auto-sync on first load when the API is unlocked
  React.useEffect(() => {
    if (window.IS_SYNC) syncFromSheet();
  }, []);

  const FIN = finData;
  const hasData = FIN.cash.length > 0 || FIN.investments.length > 0;

  const cashTotalILS     = FIN.cash.reduce((a, x) => a + toILS(x.amount, x.currency, rate), 0);
  const investTotalILS   = FIN.investments.reduce((a, x) => a + x.amount, 0);
  const depositsTotalILS = FIN.deposits.reduce((a, x) => a + x.amount, 0);
  const pensionTotalILS  = FIN.pension.reduce((a, x) => a + x.amount, 0);
  const liquidTotalILS   = FIN.cash.filter(c => c.amount > 0).reduce((a, x) => a + toILS(x.amount, x.currency, rate), 0);
  const liabilitiesILS   = FIN.cash.filter(c => c.amount < 0).reduce((a, x) => a + toILS(x.amount, x.currency, rate), 0);
  const netWorth         = cashTotalILS + investTotalILS + depositsTotalILS + pensionTotalILS;

  const buckets = [
    { label: 'Liquid',      value: Math.max(liquidTotalILS, 0), color: 'var(--mint-deep)'  },
    { label: 'Investments', value: investTotalILS,              color: 'var(--peach-deep)' },
    { label: 'Pension',     value: pensionTotalILS,             color: 'var(--lilac-deep)' },
  ];
  const denom = buckets.reduce((a, b) => a + b.value, 0) || 1;

  return (
    <div className="main-inner">
      <div className="page-head">
        <div>
          <h2>Finance</h2>
          <div className="sub">Family snapshot · last updated {FIN.updated}</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <div className="fx-pill" title="USD → ILS conversion rate">
            <span className="fx-label">$→₪</span>
            {editingRate ? (
              <input
                autoFocus
                type="number"
                step="0.01"
                value={draftRate}
                onChange={(e) => setDraftRate(e.target.value)}
                onBlur={commitRate}
                onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { setDraftRate(String(rate)); setEditingRate(false); } }}
              />
            ) : (
              <span className="fx-val" onClick={() => { setDraftRate(String(rate)); setEditingRate(true); }}>
                {rate.toFixed(2)}
              </span>
            )}
          </div>
          <button className="btn" onClick={() => setHide(h => !h)}>
            {hide ? '○ Show' : '● Hide'}
          </button>
          <button className="btn dark" onClick={syncFromSheet} disabled={syncStatus === 'loading'}>
            {syncStatus === 'loading' ? '↻ Syncing…' : syncStatus === 'error' ? '⚠ Error' : '↻ Sync'}
          </button>
        </div>
      </div>

      {!hasData && syncStatus !== 'loading' && (
        <div className="card" style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--muted)' }}>
          <div style={{ fontSize: 32, marginBottom: 12 }}>₪</div>
          <div style={{ fontWeight: 600, marginBottom: 6 }}>No data yet</div>
          <div style={{ fontSize: 13, marginBottom: 20 }}>Click Sync to load your financial data from the Sheet.</div>
          <button className="btn dark" onClick={syncFromSheet}>↻ Sync from Sheet</button>
        </div>
      )}

      {syncStatus === 'loading' && (
        <div className="card" style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--muted)' }}>
          <div style={{ fontSize: 13 }}>Loading from Sheet…</div>
        </div>
      )}

      {hasData && (
        <>
        {/* Hero */}
        <div className="fin-hero">
          <div className="block" style={{ background: 'var(--ink)', color: 'var(--paper)', position: 'relative' }}>
            <div className="block-label" style={{ color: '#bfb8a4', opacity: 1 }}>Net worth</div>
            <div className="fin-big" data-hide={hide}>{fmtILS(netWorth)}</div>
            <div className="fin-sub">
              <span className="dot mint" /> Liquid {fmtILS(liquidTotalILS)}
              <span className="dot peach" /> Investments {fmtILS(investTotalILS)}
              <span className="dot lilac" /> Pension {fmtILS(pensionTotalILS)}
            </div>
            {liabilitiesILS < 0 && (
              <div className="fin-debt">Owed on cards · <b>{fmtILS(liabilitiesILS)}</b></div>
            )}
          </div>
          <div className="block butter">
            <div className="block-label">Composition</div>
            <FinDonut buckets={buckets} hide={hide} total={denom} />
          </div>
        </div>

        {/* Bank — single row, no sub-total in header since amount shown in row */}
        {FIN.cash.length > 0 && (
          <FinSection title="Bank" sub="">
            <div className="fin-table">
              {FIN.cash.map(a => (
                <div key={a.id} className="fin-row-2col">
                  <div className="fin-row-main">
                    <div className="fin-row-name">{a.name}</div>
                  </div>
                  <div className="fin-row-amt" data-hide={hide}>{fmtILS(a.amount)}</div>
                </div>
              ))}
            </div>
          </FinSection>
        )}

        {/* Investments — 3-col with %, IBI+IBKR show USD inline */}
        {FIN.investments.length > 0 && (
          <FinSection title="Investments" sub={`${FIN.investments.length} positions · ${fmtILS(investTotalILS)} total`}>
            <div className="fin-table">
              {FIN.investments.map(it => {
                const pct = investTotalILS > 0 ? (it.amount / investTotalILS) * 100 : 0;
                const usdAmt = it.amountUSD != null
                  ? it.amountUSD
                  : it.convertToUSD ? Math.round(it.amount / rate) : null;
                return (
                  <div key={it.id} className={`fin-row ${it.frozen ? 'frozen' : ''}`}>
                    <div className="fin-row-bar" style={{ width: `${pct}%` }} />
                    <div className="fin-row-main">
                      <div className="fin-row-name">{it.name}</div>
                      {it.note && it.note !== it.updated && <div className="fin-row-note">{it.note}</div>}
                    </div>
                    <div className="fin-row-pct">{pct.toFixed(1)}%</div>
                    <div style={{ textAlign: 'right' }}>
                      <div className="fin-row-amt" data-hide={hide}>{fmtILS(it.amount)}</div>
                      {usdAmt != null && (
                        <div className="fin-row-usd" data-hide={hide}>
                          {fmtUSD(usdAmt)}{it.convertToUSD ? <span style={{opacity:0.6}}> ÷{rate.toFixed(2)}</span> : ''}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
              <div className="fin-row total">
                <div className="fin-row-main"><div className="fin-row-name">Total</div></div>
                <div className="fin-row-pct">100%</div>
                <div className="fin-row-amt" data-hide={hide}>{fmtILS(investTotalILS)}</div>
              </div>
            </div>
          </FinSection>
        )}

        {/* Pension — 2-col, full width */}
        {FIN.pension.length > 0 && (
          <FinSection title="Pension" sub={fmtILS(pensionTotalILS)}>
            <div className="fin-table">
              {FIN.pension.map(p => (
                <div key={p.id} className="fin-row-2col">
                  <div className="fin-row-main">
                    <div className="fin-row-name">{p.name}</div>
                    {p.note && <div className="fin-row-note">{p.note}</div>}
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div className="fin-row-amt" data-hide={hide}>{fmtILS(p.amount)}</div>
                    <div className="fin-row-usd">{p.updated}</div>
                  </div>
                </div>
              ))}
              <div className="fin-row-2col total" style={{ background: 'var(--bg)', fontWeight: 700 }}>
                <div className="fin-row-main"><div className="fin-row-name">Total</div></div>
                <div className="fin-row-amt" data-hide={hide}>{fmtILS(pensionTotalILS)}</div>
              </div>
            </div>
          </FinSection>
        )}

        {/* RSU / Stock comp — 2-col */}
        {FIN.rsu && FIN.rsu.length > 0 && (
          <FinSection title="Stock-based comp" sub="RSUs / equity grants · not in net worth">
            <div className="fin-table">
              {FIN.rsu.map(r => {
                // Sheet column A reads like "Coupa - Vesting start date …": the part
                // before " - " is the company, the rest is the grant detail.
                // Column C is the grant's USD value when it's a bare number.
                const [company, ...rest] = String(r.name || '').split(' - ');
                const detail = rest.join(' - ').trim();
                const usdValue = /^\d+(\.\d+)?$/.test(String(r.note || '').trim()) ? Number(r.note) : null;
                return (
                  <div key={r.id} className="fin-row-2col">
                    <div className="fin-row-main">
                      <div className="fin-row-name">{company.trim()}</div>
                      {detail && <div className="fin-row-note">{detail}</div>}
                      {!detail && usdValue == null && r.note && <div className="fin-row-note">{r.note}</div>}
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div className="fin-row-amt" data-hide={hide}>{Number(r.shares).toLocaleString()} units</div>
                      {usdValue != null && (
                        <div className="fin-row-usd" data-hide={hide}>
                          {fmtUSD(usdValue)} · ≈{fmtILS(usdValue * rate)}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </FinSection>
        )}
        </>
      )}
    </div>
  );
}

function FinSection({ title, sub, compact, children }) {
  return (
    <section className={`fin-section ${compact ? 'compact' : ''}`}>
      <div className="fin-section-head">
        <div className="fin-section-title">{title}</div>
        <div className="fin-section-sub">{sub}</div>
      </div>
      {children}
    </section>
  );
}

function FinDonut({ buckets, hide, total }) {
  const R = 44, C = 2 * Math.PI * R, CX = 56, CY = 56;
  let off = 0;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
      <svg width="112" height="112" viewBox="0 0 112 112" style={{ flexShrink: 0 }}>
        <circle cx={CX} cy={CY} r={R} fill="none" stroke="rgba(0,0,0,0.06)" strokeWidth="16" />
        {buckets.map((b, i) => {
          const frac = b.value / total;
          const len = frac * C;
          const seg = (
            <circle
              key={i}
              cx={CX} cy={CY} r={R}
              fill="none"
              stroke={b.color}
              strokeWidth="16"
              strokeDasharray={`${len} ${C - len}`}
              strokeDashoffset={-off}
              transform={`rotate(-90 ${CX} ${CY})`}
            />
          );
          off += len;
          return seg;
        })}
      </svg>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, minWidth: 0 }}>
        {buckets.map((b, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12 }}>
            <span style={{ width: 8, height: 8, borderRadius: 2, background: b.color, flexShrink: 0 }} />
            <span style={{ color: 'var(--ink-2)', whiteSpace: 'nowrap' }}>{b.label}</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--muted)', marginLeft: 'auto', paddingLeft: 6 }}>
              {((b.value / total) * 100).toFixed(0)}%
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { Finance, FinanceLock, FIN_PASSWORD });

</script>
<!-- app.jsx -->
<script type="text/babel">
// app.jsx — Main shell + tweaks
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "peach",
  "showSidebarCounts": true,
  "density": "comfortable"
}/*EDITMODE-END*/;

function TabIcon({ id, active }) {
  // active: use accent blue (visible on white bar). inactive: use currentColor (inherits muted grey)
  const c = active ? 'var(--accent)' : 'currentColor';
  const icons = {
    home: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke={c} strokeWidth="1.5" strokeLinejoin="round"/><path d="M7.5 18V12h5v6" stroke={c} strokeWidth="1.5" strokeLinejoin="round"/></svg>,
    shopping: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 2L3 6v11a1 1 0 001 1h12a1 1 0 001-1V6l-3-4H6z" stroke={c} strokeWidth="1.5" strokeLinejoin="round"/><path d="M3 6h14M13 10a3 3 0 01-6 0" stroke={c} strokeWidth="1.5" strokeLinecap="round"/></svg>,
    tasks: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2" stroke={c} strokeWidth="1.5"/><path d="M7 10l2.5 2.5L13 8" stroke={c} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    notes: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="4" y="2" width="12" height="16" rx="2" stroke={c} strokeWidth="1.5"/><path d="M7 7h6M7 10h6M7 13h4" stroke={c} strokeWidth="1.5" strokeLinecap="round"/></svg>,
    quotes: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 9V6a2 2 0 012-2h1M5 9a2 2 0 002 2v1a2 2 0 01-2 2M5 9h2a2 2 0 002-2V6M12 9V6a2 2 0 012-2h1M12 9a2 2 0 002 2v1a2 2 0 01-2 2M12 9h2a2 2 0 002-2V6" stroke={c} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    trips:   <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 13l2-5 5 2 3-5 2 1-2 5-5-2-2 4H3z" stroke={c} strokeWidth="1.4" strokeLinejoin="round"/><path d="M17 4l-2 2" stroke={c} strokeWidth="1.4" strokeLinecap="round"/></svg>,
    finance: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke={c} strokeWidth="1.5"/><path d="M10 6v1.5M10 12.5V14M8 9.5c0-.83.67-1.5 1.5-1.5h1a1.5 1.5 0 010 3h-1a1.5 1.5 0 000 3h1c.83 0 1.5-.67 1.5-1.5" stroke={c} strokeWidth="1.5" strokeLinecap="round"/></svg>,
  };
  return icons[id] || null;
}

// Expose for sidebar.jsx (loads before this file, but only renders after)
Object.assign(window, { TabIcon });

const ALL_TABS = [
  { id: 'home',     label: 'Home'     },
  { id: 'shopping', label: 'Shopping' },
  { id: 'tasks',    label: 'Tasks'    },
  { id: 'notes',    label: 'Notes'    },
  { id: 'quotes',   label: 'Quotes'   },
  { id: 'trips',    label: 'Trips'    },
  { id: 'finance',  label: 'Finance'  },
];

function MobileTabBar({ active, onNav }) {
  const [state, setState] = useStore();
  const syncStatus = useSyncStatus();
  const [showDrawer, setShowDrawer] = React.useState(false);
  const [editMode, setEditMode] = React.useState(false);

  const pinned = state.mobilePinned || ['home', 'shopping', 'tasks', 'notes'];
  const overflow = ALL_TABS.filter(t => !pinned.includes(t.id));

  function setPinned(next) { setState(s => ({ ...s, mobilePinned: next })); }

  function togglePin(id) {
    if (pinned.includes(id)) {
      if (pinned.length <= 1) return; // keep at least 1
      setPinned(pinned.filter(x => x !== id));
    } else {
      setPinned([...pinned, id]);
    }
  }

  // Drag-to-reorder pinned tabs in edit mode
  const pinnedObjs = pinned.map(id => ({ id }));
  const { getHandleProps: getPinnedHandle, dragState: pinnedDrag } = useReorder(
    pinnedObjs,
    (next) => setPinned(next.map(x => x.id))
  );

  const dotColor = { synced: '#34C759', saving: '#FF9500', loading: '#FF9500', error: '#FF3B30', local: '#aeaeb2' }[syncStatus] || '#aeaeb2';

  function navAndClose(id) { onNav(id); setShowDrawer(false); setEditMode(false); }

  const hasOverflow = overflow.length > 0;
  const isOverflowActive = overflow.some(t => t.id === active);

  return (
    <>
      {showDrawer && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 98 }}
          onClick={() => { setShowDrawer(false); setEditMode(false); }}>
          <div className="mobile-drawer" onClick={e => e.stopPropagation()}>
            <div className="mobile-drawer-header">
              <span style={{ fontSize: 13, fontWeight: 600 }}>
                {editMode ? 'Edit tabs' : 'All tabs'}
              </span>
              <button className="mobile-drawer-edit" onClick={() => setEditMode(e => !e)}>
                {editMode ? 'Done' : 'Edit'}
              </button>
            </div>

            {editMode ? (
              <>
                <div style={{ fontSize: 11, color: 'var(--muted)', padding: '0 4px 8px', textAlign: 'center' }}>
                  Pinned tabs ({pinned.length}) · tap to unpin · ⠿ drag to reorder
                </div>
                {/* Pinned tabs — draggable */}
                <div style={{ marginBottom: 8 }}>
                  {pinned.map(id => {
                    const t = ALL_TABS.find(x => x.id === id);
                    if (!t) return null;
                    const isDragging = pinnedDrag.draggingId === id;
                    const isOver = pinnedDrag.overId === id && !isDragging;
                    return (
                      <div key={id} data-reorder-id={id}
                        className={['mobile-edit-row', isDragging ? 'reorder-dragging' : '', isOver ? 'reorder-over' : ''].filter(Boolean).join(' ')}>
                        <span className="reorder-handle" {...getPinnedHandle(id)} style={{ padding: '4px 8px', color: 'var(--muted)', cursor: 'grab', fontSize: 16 }}>⠿</span>
                        <div className="mobile-tab-icon" style={{ flexShrink: 0 }}><TabIcon id={t.id} active={false} /></div>
                        <span style={{ flex: 1, fontSize: 13, marginLeft: 8 }}>{t.label}</span>
                        <button className="pill-btn red" onClick={() => togglePin(id)}>Unpin</button>
                      </div>
                    );
                  })}
                </div>
                {overflow.length > 0 && (
                  <>
                    <div style={{ fontSize: 11, color: 'var(--muted)', padding: '0 4px 8px', textAlign: 'center' }}>
                      Not pinned · tap to pin
                    </div>
                    {overflow.map(t => (
                      <div key={t.id} className="mobile-edit-row">
                        <div style={{ width: 32 }} />
                        <div className="mobile-tab-icon" style={{ flexShrink: 0, opacity: 0.5 }}><TabIcon id={t.id} active={false} /></div>
                        <span style={{ flex: 1, fontSize: 13, marginLeft: 8, color: 'var(--muted)' }}>{t.label}</span>
                        <button className="pill-btn accent" onClick={() => togglePin(t.id)}>Pin</button>
                      </div>
                    ))}
                  </>
                )}
              </>
            ) : (
              <div className="mobile-drawer-grid">
                {ALL_TABS.map(t => (
                  <button key={t.id} className={`mobile-drawer-tab ${active === t.id ? 'active' : ''}`}
                    onClick={() => navAndClose(t.id)}>
                    <TabIcon id={t.id} active={active === t.id} />
                    <span className="mobile-drawer-label">{t.label}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Tab bar — centered pinned tabs */}
      <div className="mobile-tab-bar">
        <div style={{ position: 'absolute', top: 7, right: 12, width: 6, height: 6, borderRadius: '50%', background: dotColor, zIndex: 1,
          boxShadow: (syncStatus === 'loading' || syncStatus === 'saving') ? `0 0 0 3px ${dotColor}33` : 'none' }} />
        <div className="mobile-tab-inner">
          {pinned.map(id => {
            const t = ALL_TABS.find(x => x.id === id);
            if (!t) return null;
            return (
              <button key={t.id} className={`mobile-tab ${active === t.id ? 'active' : ''}`} onClick={() => onNav(t.id)}>
                <div className="mobile-tab-icon"><TabIcon id={t.id} active={active === t.id} /></div>
                <span className="mobile-tab-label">{t.label}</span>
              </button>
            );
          })}
          {/* More button — only when there are overflow tabs */}
          {hasOverflow && (
            <button className={`mobile-tab ${isOverflowActive ? 'active' : ''}`} onClick={() => setShowDrawer(d => !d)}>
              <div className="mobile-tab-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <circle cx="4"  cy="10" r="1.8" fill={isOverflowActive ? 'var(--accent)' : 'currentColor'}/>
                  <circle cx="10" cy="10" r="1.8" fill={isOverflowActive ? 'var(--accent)' : 'currentColor'}/>
                  <circle cx="16" cy="10" r="1.8" fill={isOverflowActive ? 'var(--accent)' : 'currentColor'}/>
                </svg>
              </div>
              <span className="mobile-tab-label">{isOverflowActive ? overflow.find(t => t.id === active)?.label : 'More'}</span>
            </button>
          )}
          {/* If all tabs pinned — show edit button instead of More */}
          {!hasOverflow && (
            <button className="mobile-tab" onClick={() => { setShowDrawer(true); setEditMode(true); }}>
              <div className="mobile-tab-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M10 3v14M3 10h14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                </svg>
              </div>
              <span className="mobile-tab-label">Edit</span>
            </button>
          )}
        </div>
      </div>
    </>
  );
}

// Finance PIN persistence is DESKTOP-ONLY: on the Mac, reopening the app
// within a week skips the PIN (that convenience was explicitly asked for).
// Phones are shared/glanceable, so any touch device asks for the PIN on
// every visit — and wipes any stamp left over from before this rule.
// Switching away from the Finance tab mid-session re-locks it immediately
// on all platforms (see onNav below), unchanged from before.
const FIN_UNLOCK_TTL_MS = 7 * 24 * 60 * 60 * 1000;
const FIN_PERSIST = typeof navigator !== 'undefined' && (navigator.maxTouchPoints || 0) === 0;

function loadFinanceUnlocked() {
  try {
    if (!FIN_PERSIST) { localStorage.removeItem(FIN_LOCK_KEY); return false; }
    const ts = parseInt(localStorage.getItem(FIN_LOCK_KEY), 10);
    return ts > 0 && (Date.now() - ts) < FIN_UNLOCK_TTL_MS;
  } catch { return false; }
}

function App() {
  const [tab, setTab] = React.useState('home');
  const [focusNote, setFocusNote] = React.useState(null);
  const [financeUnlocked, setFinanceUnlocked] = React.useState(loadFinanceUnlocked);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  function go(t, payload) {
    setTab(t);
    if (t === 'notes' && payload) setFocusNote(payload);
  }

  function onNav(t) {
    if (tab === 'finance' && t !== 'finance') setFinanceUnlocked(false);
    setTab(t);
    setFocusNote(null);
  }

  const screens = {
    home: <Home go={go} />,
    shopping: <Shopping />,
    tasks: <Tasks />,
    notes: <Notes focusId={focusNote} />,
    quotes: <Quotes />,
    trips: <Trips />,
    finance: financeUnlocked
      ? <Finance />
      : <FinanceLock onUnlock={() => {
          try { if (FIN_PERSIST) localStorage.setItem(FIN_LOCK_KEY, String(Date.now())); } catch {}
          setFinanceUnlocked(true);
        }} />,
  };

  return (
    <div className="mac-shell" data-screen-label="Desktop · macOS">
      <div className="mac-titlebar">
        <div className="tl-dot red" />
        <div className="tl-dot yellow" />
        <div className="tl-dot green" />
        <div className="mac-title"><b>Keeper</b> · Personal Dashboard</div>
        <div style={{ width: 56 }} />
      </div>
      <div className="mac-body">
        <Sidebar active={tab} onNav={onNav} />
        <main className="main">{screens[tab]}</main>
      </div>
      <MobileTabBar active={tab} onNav={onNav} />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Look">
          <TweakRadio
            label="Density"
            value={tweaks.density}
            onChange={(v) => setTweak('density', v)}
            options={[
              { value: 'comfortable', label: 'Comfortable' },
              { value: 'compact', label: 'Compact' },
            ]}
          />
        </TweakSection>
        <TweakSection title="Home widget order">
          <HomeOrderTweak />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

function HomeOrderTweak() {
  const [state, setState] = useStore();
  const order = state.homeOrder || ['today', 'quote', 'shopping'];
  const LABELS = { today: 'Today', quote: 'Quote', shopping: 'Shopping' };

  function move(idx, dir) {
    const next = [...order];
    const target = idx + dir;
    if (target < 0 || target >= next.length) return;
    [next[idx], next[target]] = [next[target], next[idx]];
    setState(s => ({ ...s, homeOrder: next }));
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {order.map((k, i) => (
        <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px', background: 'rgba(0,0,0,0.04)', borderRadius: 8 }}>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--muted)' }}>{i+1}</span>
          <span style={{ flex: 1, fontSize: 13 }}>{LABELS[k]}</span>
          <button className="btn tiny" onClick={() => move(i, -1)} disabled={i === 0}>↑</button>
          <button className="btn tiny" onClick={() => move(i, 1)} disabled={i === order.length - 1}>↓</button>
        </div>
      ))}
    </div>
  );
}

function Root() {
  return (
    <StoreProvider>
      <UndoProvider>
        <App />
      </UndoProvider>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

</script>
