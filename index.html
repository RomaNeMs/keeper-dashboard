<script type="text/babel">
// home.jsx — Overview screen with reorderable widgets
const ALL_WIDGETS = [
  { id: 'today',    label: 'Tasks today',     color: 'sky'    },
  { id: 'quote',    label: "Today's quote",   color: 'peach'  },
  { id: 'shopping', label: 'Shopping list',   color: 'mint'   },
  { id: 'notes',    label: 'Recent notes',    color: 'peach'  },
  { id: 'upcoming', label: 'Upcoming tasks',  color: 'lilac'  },
  { id: 'trips',    label: 'Active trips',    color: 'sand'   },
  { id: 'finance',  label: 'Finance snapshot',color: 'butter' },
];

function Home({ go }) {
  const [state, setState] = useStore();
  const [showSettings, setShowSettings] = React.useState(false);

  const rawOrder = state.homeOrder  || ['today', 'quote', 'shopping'];
  const hidden   = state.homeHidden || [];

  // Clean order: keep only known widget ids, then append any new ones not yet in order
  const knownIds = ALL_WIDGETS.map(w => w.id);
  const cleanOrder = [
    ...rawOrder.filter(k => knownIds.includes(k)),
    ...knownIds.filter(k => !rawOrder.includes(k)),
  ];
  const order = cleanOrder.filter(k => !hidden.includes(k));

  function setOrder(next) { setState(s => ({ ...s, homeOrder: next })); }
  function toggleHide(id) {
    setState(s => {
      const h = s.homeHidden || [];
      return { ...s, homeHidden: h.includes(id) ? h.filter(x => x !== id) : [...h, id] };
    });
  }

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const todaysTasks   = state.tasks.filter(t => !t.done && daysUntil(t.due) === 0);
  const overdue       = state.tasks.filter(t => !t.done && daysUntil(t.due) !== null && daysUntil(t.due) < 0);
  const upcomingTasks = state.tasks.filter(t => !t.done && daysUntil(t.due) !== null && daysUntil(t.due) > 0 && daysUntil(t.due) <= 7);
  // Daily quote — deterministic per day, but the ↻ button can shuffle it for this session
  const [quoteIdx, setQuoteIdx] = React.useState(null);
  const dailyQuote    = state.quotes[(quoteIdx ?? new Date().getDate()) % state.quotes.length];
  function refreshQuote() {
    if (state.quotes.length < 2) return;
    const cur = (quoteIdx ?? new Date().getDate()) % state.quotes.length;
    let next = Math.floor(Math.random() * state.quotes.length);
    if (next === cur) next = (next + 1) % state.quotes.length;
    setQuoteIdx(next);
  }
  const shopActive    = state.shopping.items
    .filter(i => !i.done)
    .sort((a, b) => {
      const cats = state.shopping.cats.map(c => c.id);
      return cats.indexOf(a.cat) - cats.indexOf(b.cat);
    })
    .slice(0, 5);
  const recentNotes = [...(state.notes || [])]
    .sort((a, b) => (b.updated || 0) - (a.updated || 0))
    .slice(0, 3);

  function toggleTask(id) {
    setState(s => ({ ...s, tasks: s.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t) }));
  }

  // useReorder for drag-to-reorder widgets
  const { getHandleProps, dragState } = useReorder(
    order.map(id => ({ id })),
    (next) => setOrder(next.map(x => x.id))
  );

  const widgets = {
    today: (
      <div className="block sky" key="today">
        <div className="block-label">Tasks · {todaysTasks.length + overdue.length} due today</div>
        {overdue.length === 0 && todaysTasks.length === 0 && (
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 22, lineHeight: 1.3 }}>
            Nothing due today. <em style={{ color: 'rgba(0,0,0,0.5)' }}>Breathe in.</em>
          </div>
        )}
        {[...overdue, ...todaysTasks].slice(0, 5).map(t => (
          <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: '1px dashed rgba(0,0,0,0.12)' }}>
            <Checkbox checked={t.done} onClick={() => toggleTask(t.id)} />
            <div style={{ flex: 1, fontSize: 14 }} dir={isRTL(t.text) ? 'rtl' : 'ltr'}>{t.text}</div>
            {t.due && <DueChip due={t.due} />}
          </div>
        ))}
        <div style={{ marginTop: 12 }}>
          <button className="btn tiny" onClick={() => go('tasks')}>Open Tasks →</button>
        </div>
      </div>
    ),
    quote: (
      <div className="block peach" key="quote">
        <button className="quote-refresh-btn" onClick={refreshQuote} title="Show another quote">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M13.5 8a5.5 5.5 0 11-1.6-3.9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
            <path d="M13.7 1.6v2.8h-2.8" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
        <div className="block-label">Today's quote</div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 24, lineHeight: 1.3, letterSpacing: '-0.3px' }}>
          "{dailyQuote.text}"
        </div>
        <div style={{ marginTop: 12, fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: 1.4, textTransform: 'uppercase', opacity: 0.65 }}>
          — {dailyQuote.author}
        </div>
      </div>
    ),
    shopping: (
      <div className="block mint" key="shopping">
        <div className="block-label">Shopping · {shopActive.length} open</div>
        {shopActive.length === 0
          ? <div style={{ fontFamily: 'var(--font-display)', fontSize: 20 }}>List is clear.</div>
          : shopActive.map(i => (
            <div key={i.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 0' }} dir={isRTL(i.name) ? 'rtl' : 'ltr'}>
              <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--ink)', flexShrink: 0 }} />
              <div style={{ flex: 1, fontSize: 14 }}>{i.name}</div>
              {i.qty != null && <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, opacity: 0.6 }}>×{i.qty}</span>}
            </div>
          ))
        }
        <div style={{ marginTop: 12 }}>
          <button className="btn tiny" onClick={() => go('shopping')}>Open List →</button>
        </div>
      </div>
    ),
    notes: (
      <div className="block peach" key="notes">
        <div className="block-label">Recent notes</div>
        {recentNotes.length === 0
          ? <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, opacity: 0.6 }}>No notes yet.</div>
          : recentNotes.map(n => (
            <div key={n.id} onClick={() => go('notes', n.id)}
              style={{ padding: '7px 0', borderBottom: '1px dashed rgba(0,0,0,0.12)', cursor: 'pointer' }}>
              <div style={{ fontSize: 14, fontWeight: 600 }}>{n.title}</div>
              {n.lines?.[0] && (
                <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 2, overflow: 'hidden', whiteSpace: 'nowrap', textOverflow: 'ellipsis' }}>
                  {n.lines[0].text}
                </div>
              )}
            </div>
          ))
        }
        <div style={{ marginTop: 12 }}>
          <button className="btn tiny" onClick={() => go('notes')}>Open Notes →</button>
        </div>
      </div>
    ),
    upcoming: (
      <div className="block lilac" key="upcoming">
        <div className="block-label">Upcoming · next 7 days</div>
        {upcomingTasks.length === 0
          ? <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, opacity: 0.6 }}>Nothing coming up.</div>
          : upcomingTasks.slice(0, 5).map(t => (
            <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: '1px dashed rgba(0,0,0,0.12)' }}>
              <Checkbox checked={t.done} onClick={() => toggleTask(t.id)} />
              <div style={{ flex: 1, fontSize: 14 }} dir={isRTL(t.text) ? 'rtl' : 'ltr'}>{t.text}</div>
              {t.due && <DueChip due={t.due} />}
            </div>
          ))
        }
        <div style={{ marginTop: 12 }}>
          <button className="btn tiny" onClick={() => go('tasks')}>Open Tasks →</button>
        </div>
      </div>
    ),
    trips: (() => {
      const activeTrips = (state.trips || []).filter(t => t.active);
      return (
        <div className="block sand" key="trips">
          <div className="block-label">Active trips · {activeTrips.length}</div>
          {activeTrips.length === 0
            ? <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, opacity: 0.6 }}>No active trips.</div>
            : activeTrips.slice(0, 3).map(t => {
                const total = (t.expenses || []).reduce((sum, e) => {
                  if (e.currency === 'ILS') return sum + e.amount;
                  if (e.currency === 'USD') return sum + e.amount * (t.usdRate || 3.7);
                  if (e.currency === 'EUR') return sum + e.amount * (t.eurRate || 3.9);
                  return sum;
                }, 0);
                return (
                  <div key={t.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px dashed rgba(0,0,0,0.12)' }}>
                    <div style={{ fontSize: 14, fontWeight: 500 }}>{t.name}</div>
                    <div style={{ fontSize: 13, fontWeight: 600, fontFamily: 'var(--font-mono)' }}>
                      ₪{Math.round(total).toLocaleString('en-US')}
                    </div>
                  </div>
                );
              })
          }
          <div style={{ marginTop: 12 }}>
            <button className="btn tiny" onClick={() => go('trips')}>Open Trips →</button>
          </div>
        </div>
      );
    })(),
    finance: (
      <div className="block butter" key="finance">
        <div className="block-label">Finance</div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, opacity: 0.7 }}>
          Open Finance for the full snapshot.
        </div>
        <div style={{ marginTop: 12 }}>
          <button className="btn tiny" onClick={() => go('finance')}>Open Finance →</button>
        </div>
      </div>
    ),
  };

  return (
    <div className="main-inner">
      <div className="h-greet">
        <h1 style={{ fontFamily: 'var(--font-display)', fontWeight: 600 }}>{greeting}</h1>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div className="h-date">{fmtDate()}</div>
          <button
            className="home-settings-btn"
            onClick={() => setShowSettings(s => !s)}
            title="Customize widgets"
            style={{ background: showSettings ? 'var(--accent)' : undefined, color: showSettings ? '#fff' : undefined }}
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="2.5" stroke="currentColor" strokeWidth="1.4"/>
              <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.42 1.42M11.54 11.54l1.41 1.41M11.54 3.05l1.41 1.42M3.05 11.54l1.42 1.41" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      {showSettings && (
        <div className="card" style={{ marginBottom: 14, padding: '12px 16px' }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--muted)', marginBottom: 10, textTransform: 'uppercase', letterSpacing: 0.6 }}>
            Home widgets — drag to reorder, toggle to show/hide
          </div>
          {ALL_WIDGETS.map(w => (
            <div key={w.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: '1px solid var(--line)' }}>
              <div style={{ width: 10, height: 10, borderRadius: 3, background: `var(--${w.color})`, flexShrink: 0 }}/>
              <span style={{ flex: 1, fontSize: 13 }}>{w.label}</span>
              <button
                className={`pill-btn ${hidden.includes(w.id) ? 'neutral' : 'accent'}`}
                onClick={() => toggleHide(w.id)}>
                {hidden.includes(w.id) ? 'Show' : 'Hide'}
              </button>
            </div>
          ))}
          <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 8 }}>
            Drag the ⠿ handle on each widget to reorder. Changes sync across devices.
          </div>
        </div>
      )}

      <div className="home-grid">
        {order.map(k => {
          if (!widgets[k]) return null;
          const isDragging = dragState.draggingId === k;
          const isOver     = dragState.overId === k && !isDragging;
          const overBelow  = isOver && order.indexOf(k) > order.indexOf(dragState.draggingId);
          const handleProps = getHandleProps(k);
          return (
            <div
              key={k}
              data-reorder-id={k}
              className={[
                'home-widget-wrap',
                isDragging ? 'reorder-dragging' : '',
                isOver ? `reorder-over ${overBelow ? 'reorder-over-below' : ''}` : '',
              ].filter(Boolean).join(' ')}
            >
              {/* Drag handle — overlaid top-left of widget */}
              <span className="home-drag-handle reorder-handle" {...handleProps} title="Drag to reorder">⠿</span>
              {widgets[k]}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Checkbox({ checked, onClick }) {
  return (
    <div className={`checkbox ${checked ? 'checked' : ''}`} onClick={e => { e.stopPropagation(); onClick && onClick(); }}>
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
        <path d="M2 6l2.5 2.5L9 3" stroke="#fbf9f4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </div>
  );
}

function DueChip({ due }) {
  const n = daysUntil(due);
  let cls = '';
  if (n < 0) cls = 'overdue';
  else if (n === 0) cls = 'today';
  return <span className={`task-due ${cls}`}>{dueLabel(due)}</span>;
}

Object.assign(window, { Home, Checkbox, DueChip });

</script>

<script type="text/babel">
// shopping.jsx — Shopping list, tap item name to Google search
const CAT_COLOR_BG = {
  mint: 'var(--mint)',
  sky: 'var(--sky)',
  peach: 'var(--peach)',
  butter: 'var(--butter)',
  lilac: 'var(--lilac)',
  coral: 'var(--coral)',
};

// Reinsert a reordered category subsequence back into the flat items array,
// preserving the position of every item NOT in this category. `nextCatItems`
// is the already-reordered list scoped to one category (from useReorder).
function reorderWithinCat(allItems, catId, nextCatItems) {
  let cursor = 0;
  return allItems.map(it => it.cat === catId ? nextCatItems[cursor++] : it);
}

function Shopping() {
  const [state, setState] = useStore();
  const undo = useUndo();
  const [editingQty, setEditingQty] = React.useState(null);
  const [editingName, setEditingName] = React.useState(null);
  const [editingCat, setEditingCat] = React.useState(null);
  const [showNewCat, setShowNewCat] = React.useState(false);

  const items = state.shopping.items;
  const cats  = state.shopping.cats;
  // Per-category collapse, synced like tripsCollapsed
  const shopCollapsed = state.shopCollapsed || {};
  function toggleCatCollapse(catId) {
    setState(s => ({ ...s, shopCollapsed: { ...(s.shopCollapsed || {}), [catId]: !(s.shopCollapsed || {})[catId] } }));
  }

  function addItem(catId, name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    // New items go on top — since each category's row order is just this
    // array filtered by cat, prepending to the whole list puts it first
    // within its own category too.
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, items: [{ id: uid(), cat: catId, name: trimmed, qty: null, done: false }, ...s.shopping.items] }
    }));
  }
  function toggle(id) {
    setState(s => {
      const idx = s.shopping.items.findIndex(i => i.id === id);
      if (idx === -1) return s;
      const item = s.shopping.items[idx];
      const items = [...s.shopping.items];
      items.splice(idx, 1);
      if (!item.done) {
        // Checking: remember the slot within its category, then sink to the end
        // (last within the category — row order is just this array filtered by cat).
        const prevPos = s.shopping.items.slice(0, idx).filter(i => i.cat === item.cat).length;
        items.push({ ...item, done: true, prevPos });
      } else {
        // Unchecking: put it back in the slot it came from
        const { prevPos, ...rest } = item;
        const restored = { ...rest, done: false };
        let insertAt = idx;
        if (prevPos != null) {
          let seen = 0, found = false;
          for (let k = 0; k < items.length; k++) {
            if (items[k].cat !== item.cat) continue;
            if (seen === prevPos) { insertAt = k; found = true; break; }
            seen++;
          }
          if (!found) {
            const lastSame = items.map(i => i.cat).lastIndexOf(item.cat);
            insertAt = lastSame === -1 ? items.length : lastSame + 1;
          }
        }
        items.splice(insertAt, 0, restored);
      }
      return { ...s, shopping: { ...s.shopping, items } };
    });
  }
  function clearChecked(catId) {
    const toRemove = state.shopping.items.filter(i => i.cat === catId && i.done);
    if (toRemove.length === 0) return;
    const prevItems = state.shopping.items;
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, items: s.shopping.items.filter(i => !(i.cat === catId && i.done)) }
    }));
    if (undo) {
      undo(`${toRemove.length} checked item${toRemove.length > 1 ? 's' : ''} cleared`,
        () => setState(s => ({ ...s, shopping: { ...s.shopping, items: prevItems } })));
    }
  }
  function remove(id) {
    const idx = state.shopping.items.findIndex(i => i.id === id);
    const removed = state.shopping.items[idx];
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, items: s.shopping.items.filter(i => i.id !== id) }
    }));
    if (removed && undo) {
      undo(`"${removed.name}" removed`, () => setState(s => {
        const items = [...s.shopping.items];
        items.splice(Math.min(idx, items.length), 0, removed);
        return { ...s, shopping: { ...s.shopping, items } };
      }));
    }
  }
  function setName(id, name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, items: s.shopping.items.map(i => i.id === id ? { ...i, name: trimmed } : i) }
    }));
  }
  function setQty(id, qty) {
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, items: s.shopping.items.map(i => i.id === id ? { ...i, qty } : i) }
    }));
  }
  function setCatName(catId, name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, cats: s.shopping.cats.map(c => c.id === catId ? { ...c, name: trimmed } : c) }
    }));
  }
  function addCategory(name, color) {
    const trimmed = name.trim();
    if (!trimmed) return;
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, cats: [...s.shopping.cats, { id: uid(), name: trimmed, color }] }
    }));
    setShowNewCat(false);
  }
  function deleteCategory(catId) {
    const cat = state.shopping.cats.find(c => c.id === catId);
    if (!cat) return;
    const prevCats = state.shopping.cats;
    const prevItems = state.shopping.items;
    const n = prevItems.filter(i => i.cat === catId).length;
    setState(s => ({
      ...s,
      shopping: {
        ...s.shopping,
        cats: s.shopping.cats.filter(c => c.id !== catId),
        items: s.shopping.items.filter(i => i.cat !== catId),
      }
    }));
    if (undo) {
      undo(`"${cat.name}" deleted${n ? ` · ${n} item${n > 1 ? 's' : ''}` : ''}`,
        () => setState(s => ({ ...s, shopping: { ...s.shopping, cats: prevCats, items: prevItems } })));
    }
  }
  function reorderCatItems(catId, nextCatItems) {
    setState(s => ({
      ...s,
      shopping: { ...s.shopping, items: reorderWithinCat(s.shopping.items, catId, nextCatItems) }
    }));
  }
  function reorderCats(nextCats) {
    setState(s => ({ ...s, shopping: { ...s.shopping, cats: nextCats } }));
  }
  function openSearch(name) {
    const url = `https://www.google.com/search?q=${encodeURIComponent(name)}`;
    window.open(url, '_blank', 'noreferrer');
  }

  const { getHandleProps: getCatHandleProps, dragState: catDragState } = useReorder(cats, reorderCats);

  return (
    <div className="main-inner">
      <div className="page-head">
        <div>
          <h2>Shopping</h2>
          <div className="sub">{items.filter(i => !i.done).length} open · tap item to search</div>
        </div>
        <button className="btn dark" onClick={() => setShowNewCat(true)}>+ New category</button>
      </div>

      <div className="shop-list">
        {cats.map(cat => {
          const catItems = items.filter(i => i.cat === cat.id);
          const open = catItems.filter(i => !i.done).length;
          const isCatDragging = catDragState.draggingId === cat.id;
          const isCatOver = catDragState.overId === cat.id && !isCatDragging;
          const catOverBelow = isCatOver && cats.findIndex(x => x.id === cat.id) > cats.findIndex(x => x.id === catDragState.draggingId);
          return (
            <CatBlock
              key={cat.id}
              cat={cat}

// Swipe-to-reveal on mobile (touch drag on the row body, not the handle).
// Desktop: edit/delete buttons are always visible, no hover-reveal.
const SWIPE_OPEN_X = -156; // 3 buttons × 52px: search + edit + delete
const SWIPE_THRESHOLD = -36;

function ShopItemRow({
  item, isDragging, isOver, overBelow, handleProps,
  editingName, editingQty, onToggle, onRemove,
  onStartEditName, onCommitName, onCancelEditName,
  onStartEditQty, onCommitQty, onOpenSearch,
}) {
  const [swipeX, setSwipeX] = React.useState(0);
  const swiping = React.useRef(null);

  function onTouchStart(e) {
    if (editingName) return;
    if (e.target.closest('[data-reorder-handle]')) return; // let the drag handle own this touch
    const t = e.touches[0];
    swiping.current = { startX: t.clientX, startY: t.clientY, openAt: swipeX, locked: null };
  }
  function onTouchMove(e) {
    const st = swiping.current;
    if (!st) return;
    const t = e.touches[0];
    const dx = t.clientX - st.startX;
    const dy = t.clientY - st.startY;
    if (st.locked === null) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      st.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (st.locked !== 'x') return;
    e.preventDefault();
    const next = Math.min(0, Math.max(SWIPE_OPEN_X, st.openAt + dx));
    setSwipeX(next);
  }
  function onTouchEnd() {
    const st = swiping.current;
    swiping.current = null;
    if (!st || st.locked !== 'x') return;
    setSwipeX(swipeX <= SWIPE_THRESHOLD ? SWIPE_OPEN_X : 0);
  }
  function closeSwipe() { setSwipeX(0); }

  const rowCls = [
    'item-row',
    item.done ? 'done' : '',
    isDragging ? 'reorder-dragging' : '',
    isOver ? `reorder-over ${overBelow ? 'reorder-over-below' : ''}` : '',
  ].filter(Boolean).join(' ');

  return (
    <div className={rowCls} data-reorder-id={item.id}>
      {/* 3 buttons × 52px — must match SWIPE_OPEN_X so no gap shows behind the row */}
      <div className="item-swipe-actions" style={{ width: 156 }}>
        <button className="item-swipe-btn search" onClick={() => { onOpenSearch(); closeSwipe(); }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4" stroke="currentColor" strokeWidth="1.4"/>
            <path d="M9 9l3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        </button>
        <button className="item-swipe-btn edit" onClick={() => { onStartEditName(); closeSwipe(); }}>
          <svg width="14" height="14" viewBox="0 0 12 12" fill="none">
            <path d="M8.5 1.5l2 2-6.5 6.5-2.3.3.3-2.3 6.5-6.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round" />
          </svg>
        </button>
        <button className="item-swipe-btn delete" onClick={() => { onRemove(); closeSwipe(); }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
          </svg>
        </button>
      </div>

      <div
        className="item-swipe-body"
        style={{ transform: `translateX(${swipeX}px)` }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        <span className="reorder-handle" {...handleProps} title="Drag to reorder">⠿</span>
        <Checkbox checked={item.done} onClick={onToggle} />
        {editingName ? (
          <input
            autoFocus
            defaultValue={item.name}
            dir={isRTL(item.name) ? 'rtl' : 'ltr'}
            style={{ flex: 1, border: '1px solid var(--accent)', borderRadius: 6, padding: '2px 8px', font: 'inherit', fontSize: 14, outline: 'none', background: 'white', boxShadow: '0 0 0 3px rgba(0,102,204,0.12)' }}
            onBlur={e => onCommitName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') onCancelEditName(); }}
          />
        ) : (
          <div
            className="item-name"
            dir={isRTL(item.name) ? 'rtl' : 'ltr'}
            onClick={() => swipeX !== 0 && closeSwipe()}
          >
            {item.name}
          </div>
        )}
        {editingQty ? (
          <input
            autoFocus
            type="number"
            defaultValue={item.qty || ''}
            style={{ width: 50, fontFamily: 'var(--font-mono)', fontSize: 12, padding: '2px 6px', borderRadius: 6, border: '1px solid rgba(0,0,0,0.2)' }}
            onBlur={(e) => onCommitQty(e.target.value ? Number(e.target.value) : null)}
            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
          />
        ) : item.qty != null ? (
          <span className="item-qty" onClick={onStartEditQty}>×{item.qty}</span>
        ) : (
          <span className="item-qty add" onClick={onStartEditQty}>+qty</span>
        )}
        <button className="item-action-btn search" onClick={onOpenSearch} title="Search online">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4" stroke="currentColor" strokeWidth="1.4"/>
            <path d="M9 9l3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        </button>
        <button className="item-action-btn edit" onClick={onStartEditName} title="Rename">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8.5 1.5l2 2-6.5 6.5-2.3.3.3-2.3 6.5-6.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round" />
          </svg>
        </button>
        <button className="item-action-btn delete" onClick={onRemove} title="Remove">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
          </svg>
        </button>
      </div>
    </div>
  );
}

</script>
<!-- tasks.jsx -->
<script type="text/babel">
// tasks.jsx — Today / Upcoming / Someday columns
function orderedBucket(tasks) {
  return [...tasks].sort((a, b) => {
    const ai = a.sortIdx, bi = b.sortIdx;
    if (ai != null && bi != null) return ai - bi;
    if (ai != null) return -1;
    if (bi != null) return 1;
    return (daysUntil(a.due) ?? 99) - (daysUntil(b.due) ?? 99);
  });
}

function Tasks() {
  const [state, setState] = useStore();
  const undo = useUndo();
  const [editingTask, setEditingTask] = React.useState(null); // { id, text, due }

  const bucketed = { today: [], upcoming: [], someday: [] };
  state.tasks.forEach(t => bucketed[dueBucket(t.due)].push(t));
  bucketed.today    = orderedBucket(bucketed.today);
  bucketed.upcoming = orderedBucket(bucketed.upcoming);
  bucketed.someday  = orderedBucket(bucketed.someday);

  function add(text, due) {
    setState(s => ({ ...s, tasks: [...s.tasks, { id: uid(), text, due, done: false }] }));
  }
  function toggle(id) {
    setState(s => ({ ...s, tasks: s.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t) }));
  }
  function remove(id) {
    const removed = state.tasks.find(t => t.id === id);
    setState(s => ({ ...s, tasks: s.tasks.filter(t => t.id !== id) }));
    if (removed && undo) {
      undo('Task deleted', () => setState(s => ({ ...s, tasks: [...s.tasks, removed] })));
    }
  }
  function saveEdit() {
    if (!editingTask) return;
    const text = editingTask.text.trim();
    if (!text) return;
    setState(s => ({ ...s, tasks: s.tasks.map(t => t.id === editingTask.id ? { ...t, text, due: editingTask.due } : t) }));
    setEditingTask(null);
  }
  function moveTask(id, bucket) {
    let due = null;
    if (bucket === 'today') due = today();
    else if (bucket === 'upcoming') due = addDaysIso(3);
    setState(s => ({ ...s, tasks: s.tasks.map(t => t.id === id ? { ...t, due, sortIdx: null } : t) }));
  }
  function reorderBucket(nextBucketTasks) {
    const idxById = new Map(nextBucketTasks.map((t, i) => [t.id, i]));
    setState(s => ({
      ...s,
      tasks: s.tasks.map(t => idxById.has(t.id) ? { ...t, sortIdx: idxById.get(t.id) } : t)
    }));
  }

  // Per-column collapse, synced like tripsCollapsed
  const taskCollapsed = state.taskCollapsed || {};
  function toggleColCollapse(id) {
    setState(s => ({ ...s, taskCollapsed: { ...(s.taskCollapsed || {}), [id]: !(s.taskCollapsed || {})[id] } }));
  }

  const editBucket = editingTask ? dueBucket(editingTask.due) : null;

  return (
    <div className="main-inner">
      <div className="page-head">
        <div>
          <h2>Tasks</h2>
          <div className="sub">{state.tasks.filter(t => !t.done).length} open · {bucketed.today.filter(t => !t.done).length} due today</div>
        </div>
      </div>
      <div className="tasks-grid">
        <TaskCol color="coral" title="Today" sub="due now"
          tasks={bucketed.today} bucketId="today" showDate
          collapsed={!!taskCollapsed.today} onToggleCollapse={() => toggleColCollapse('today')}
          onAdd={add} onToggle={toggle} onRemove={remove}
          onEdit={(t) => setEditingTask({ id: t.id, text: t.text, due: t.due })}
          onMove={moveTask} onReorder={reorderBucket} />
        <TaskCol color="sky" title="Upcoming" sub="this week"
          tasks={bucketed.upcoming} bucketId="upcoming" showDate
          collapsed={!!taskCollapsed.upcoming} onToggleCollapse={() => toggleColCollapse('upcoming')}
          onAdd={add} onToggle={toggle} onRemove={remove}
          onEdit={(t) => setEditingTask({ id: t.id, text: t.text, due: t.due })}
          onMove={moveTask} onReorder={reorderBucket} />
        <TaskCol color="butter" title="Someday" sub="no rush"
          tasks={bucketed.someday} bucketId="someday" showDate={false}
          collapsed={!!taskCollapsed.someday} onToggleCollapse={() => toggleColCollapse('someday')}
          onAdd={add} onToggle={toggle} onRemove={remove}
          onEdit={(t) => setEditingTask({ id: t.id, text: t.text, due: t.due })}
          onMove={moveTask} onReorder={reorderBucket} />
      </div>

      {editingTask && (
        <div className="modal-overlay" onClick={() => setEditingTask(null)}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3>Edit task</h3>
            <div style={{ display: 'grid', gap: 10 }}>
              <textarea
                autoFocus
                className="input"
                value={editingTask.text}
                onChange={(e) => setEditingTask(et => ({ ...et, text: e.target.value }))}
                onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); } }}
                style={{ minHeight: 70, resize: 'vertical', font: 'inherit', fontSize: 14 }}
              />
              {(editBucket === 'today' || editBucket === 'upcoming') && (
                <div>
                  <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>Due date</div>
                  <input
                    type="date"
                    className="input"
                    value={editingTask.due || ''}
                    onChange={(e) => setEditingTask(et => ({ ...et, due: e.target.value }))}
                  />
                </div>
              )}
            </div>
            <div className="modal-actions">
              <button className="btn ghost" onClick={() => setEditingTask(null)}>Cancel</button>
              <button className="btn dark" disabled={!editingTask.text.trim()} onClick={saveEdit}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function addDaysIso(n) {
  const d = new Date(); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const TASK_SWIPE_OPEN_X = -104;
const TASK_SWIPE_THRESHOLD = -36;

    const st = swiping.current;
    if (!st) return;
    const t = e.touches[0];
    const dx = t.clientX - st.startX;
    const dy = t.clientY - st.startY;
    if (st.locked === null) {

      </div>
      <div

        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >

        <Checkbox checked={task.done} onClick={onToggle} />
        <div style={{ flex: 1, minWidth: 0 }}>

          {task.due && !hideTodayChip && <DueChip due={task.due} />}
        </div>
        <button className="item-action-btn edit" onClick={onEdit} title="Edit">

          </svg>
        </button>
        <button className="item-action-btn delete" onClick={onRemove} title="Delete">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

function TaskCol({ color, title, sub, tasks, bucketId, showDate, onAdd, onToggle, onRemove, onEdit, onMove, onReorder, collapsed, onToggleCollapse }) {
  const [hover, setHover] = React.useState(false);
  const [showAddModal, setShowAddModal] = React.useState(false);
  const [draftText, setDraftText] = React.useState('');
  const [draftDue, setDraftDue] = React.useState('');
  const { getHandleProps, dragState } = useReorder(tasks, onReorder);

  function submit() {
    const text = draftText.trim();
    if (!text) return;
    let due = null;
    if (showDate) due = draftDue || (bucketId === 'today' ? today() : addDaysIso(3));
    onAdd(text, due);
    setDraftText('');
    setDraftDue('');
    setShowAddModal(false);
  }

  return (
    <div
      className={`task-col ${collapsed ? 'collapsed' : ''}`}
      style={{ background: CAT_COLOR_BG[color], outline: hover ? '2px dashed rgba(0,0,0,0.3)' : 'none' }}
      onDragOver={(e) => { e.preventDefault(); setHover(true); }}
      onDragLeave={() => setHover(false)}
      onDrop={(e) => {
        setHover(false);
        const id = e.dataTransfer.getData('text/task-id');
        if (id) onMove(id, bucketId);
      }}
    >
      <div className="task-col-head">
        <div className="task-col-title" onClick={onToggleCollapse} style={{ cursor: 'pointer' }}>{title}</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <button className="add-col-btn head-add" onClick={() => setShowAddModal(true)} title="Add task">
            + Add<span className="head-add-word"> task</span>
          </button>
          <div className="task-col-sub">{tasks.filter(t => !t.done).length} · {sub}</div>
          <button className="collapse-btn" onClick={onToggleCollapse} title={collapsed ? 'Expand' : 'Collapse'}>
            {collapsed ? '▼' : '▲'}
          </button>
        </div>
      </div>

      {!collapsed && (
      <div className="task-col-body">
        {tasks.length === 0 && <div className="empty" style={{ opacity: 0.5 }}>—</div>}
        {tasks.map(t => {
          const isDragging = dragState.draggingId === t.id;
          const isOver = dragState.overId === t.id && !isDragging;
          const overBelow = isOver && tasks.findIndex(x => x.id === t.id) > tasks.findIndex(x => x.id === dragState.draggingId);
          return (
            <TaskCard
              key={t.id}
              task={t}
              handleProps={getHandleProps(t.id)}
              isDragging={isDragging}
              isOver={isOver}
              overBelow={overBelow}
              hideTodayChip={bucketId === 'today'}
              onToggle={() => onToggle(t.id)}
              onRemove={() => onRemove(t.id)}
              onEdit={() => onEdit(t)}
            />
          );
        })}
      </div>
      )}

      {showAddModal && (
        <div className="modal-overlay" onClick={() => setShowAddModal(false)}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3>Add to {title}</h3>
            <div style={{ display: 'grid', gap: 10 }}>
              <textarea
                autoFocus
                className="input"
                placeholder="What needs doing?"
                value={draftText}
                onChange={(e) => setDraftText(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } }}
                style={{ minHeight: 70, resize: 'vertical', font: 'inherit', fontSize: 14 }}
              />
              {showDate && (
                <div>
                  <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>
                    Due date {bucketId === 'today' ? '(empty = today)' : '(empty = in 3 days)'}
                  </div>
                  <input type="date" className="input" value={draftDue} onChange={(e) => setDraftDue(e.target.value)} />
                </div>
              )}
            </div>
            <div className="modal-actions">
              <button className="btn ghost" onClick={() => setShowAddModal(false)}>Cancel</button>
              <button className="btn dark" disabled={!draftText.trim()} onClick={submit}>+ Add</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { Tasks });

</script>

<script type="text/babel">
// notes.jsx — Document-feel notes with line types + RTL auto-detect
const NOTE_COLORS = ['peach', 'sky', 'mint', 'butter', 'lilac', 'coral'];
const LINE_TYPES = [
  { id: 'h', label: 'H1', tip: 'Heading' },
  { id: 'sh', label: 'H2', tip: 'Subheading' },
  { id: 'p', label: '¶', tip: 'Paragraph' },
  { id: 'b', label: '•', tip: 'Bullet' },
  { id: 't', label: '☐', tip: 'Task' },
];
const PLACEHOLDER = {
  h: 'Heading',
  sh: 'Subheading',
  p: 'Type something…',
  b: 'List item',
  t: 'To do',
};

function Notes({ focusId }) {
  const [state, setState] = useStore();
  const undo = useUndo();
  // On mobile, start with nothing selected so the list is visible first.
  // On desktop, pre-select the first note as before.
  const IS_MOBILE = typeof window !== 'undefined' && window.innerWidth <= 680;
  const [activeId, setActiveId] = React.useState(
    focusId || (IS_MOBILE ? null : state.notes[0]?.id)
  );
  const [query, setQuery] = React.useState('');

  React.useEffect(() => { if (focusId) setActiveId(focusId); }, [focusId]);

  const active = state.notes.find(n => n.id === activeId);

  const filtered = state.notes.filter(n => {
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    return n.title.toLowerCase().includes(q) || n.lines.some(l => l.text.toLowerCase().includes(q));
  });

  function update(noteId, mutator) {
    setState(s => ({
      ...s,
      notes: s.notes.map(n => n.id === noteId ? { ...mutator(n), updated: Date.now() } : n)
    }));
  }
  function newNote() {
    const n = { id: uid(), title: 'Untitled', color: 'peach', updated: Date.now(),
      lines: [{ id: uid(), type: 'p', text: '' }] };
    setState(s => ({ ...s, notes: [n, ...s.notes] }));
    setActiveId(n.id);
  }
  function removeNote(id) {
    const idx = state.notes.findIndex(n => n.id === id);
    const removed = state.notes[idx];
    setState(s => ({ ...s, notes: s.notes.filter(n => n.id !== id) }));
    if (activeId === id) setActiveId(null);
    if (removed && undo) {
      undo(`Note "${removed.title}" deleted`, () => setState(s => {
        const notes = [...s.notes];
        notes.splice(Math.min(idx, notes.length), 0, removed);
        return { ...s, notes };
      }));
    }
  }
  function reorderNotes(next) {
    setState(s => ({ ...s, notes: next }));
  }

  const { getHandleProps: getNoteHandleProps, dragState: noteDragState } = useReorder(state.notes, reorderNotes);

  // On mobile: if a note is active, show only the doc panel (full screen).
  // The back button clears activeId to return to the list.
  const showDoc  = !!active;
  const showList = !showDoc || !IS_MOBILE;  // desktop always shows both

  return (
    <div className="main-inner">
      {/* Mobile: show page-head only on the list screen */}
      {(!IS_MOBILE || !showDoc) && (
        <div className="page-head">
          <div>
            <h2>Notes</h2>
            <div className="sub">{state.notes.length} notes · document-style, not card-grid</div>
          </div>
          <button className="btn dark" onClick={newNote}>+ New note</button>
        </div>
      )}

      {/* Mobile: back button when inside a note */}
      {IS_MOBILE && showDoc && (
        <div className="notes-mobile-back">
          <button className="btn" onClick={() => setActiveId(null)}>← Notes</button>
          <span className="notes-mobile-title">{active.title}</span>
        </div>
      )}

      <div className={`notes-layout ${IS_MOBILE && showDoc ? 'notes-layout-doc' : ''}`}>
        {showList && (
          <div className="notes-list">
            <div className="note-search">
              <input placeholder="Search notes…" value={query} onChange={(e) => setQuery(e.target.value)} />
            </div>
            {filtered.map(n => {
              const snip = n.lines.find(l => l.text && l.type !== 'h' && l.type !== 'sh')?.text || '';
              const isDragging = noteDragState.draggingId === n.id;
              const isOver = noteDragState.overId === n.id && !isDragging;
              const overBelow = isOver && state.notes.findIndex(x => x.id === n.id) > state.notes.findIndex(x => x.id === noteDragState.draggingId);
              return (
                <div key={n.id}
                  data-reorder-id={n.id}
                  className={[
                    'note-tab',
                    activeId === n.id ? 'active' : '',
                    isDragging ? 'reorder-dragging' : '',
                    isOver ? `reorder-over ${overBelow ? 'reorder-over-below' : ''}` : '',
                  ].filter(Boolean).join(' ')}
                  onClick={() => setActiveId(n.id)}
                >
                  <span className="reorder-handle note-list-handle" {...getNoteHandleProps(n.id)}>⠿</span>
                  <div className="note-swatch" style={{ background: CAT_COLOR_BG[n.color] }} />
                  <div className="note-tab-inner">
                    <div className="note-tab-title" dir={isRTL(n.title) ? 'rtl' : 'ltr'}>{n.title}</div>
                    <div className="note-tab-snip" dir={isRTL(snip) ? 'rtl' : 'ltr'}>{snip}</div>
                  </div>
                </div>
              );
            })}
            {filtered.length === 0 && <div className="empty">No matches</div>}
          </div>
        )}

        {showDoc ? (
          <NoteDoc note={active} onUpdate={(m) => update(active.id, m)} onDelete={() => { removeNote(active.id); setActiveId(null); }} />
        ) : (
          !IS_MOBILE && <div className="empty">Select a note</div>
        )}
      </div>
    </div>
  );
}

function NoteDoc({ note, onUpdate, onDelete }) {
  const [openMenu, setOpenMenu] = React.useState(null);
  // Read mode by default — no contentEditable, so opening a note never pops
  // the keyboard on iOS. Editing is an explicit choice.
  const [editing, setEditing] = React.useState(false);
  React.useEffect(() => {
    // Fresh empty notes open in edit mode; existing notes open read-only.
    const isEmpty = note.lines.length === 1 && !note.lines[0].text;
    setEditing(isEmpty);
    setOpenMenu(null);
  }, [note.id]);

  function setTitle(t) { onUpdate(n => ({ ...n, title: t })); }
  function setColor(c) { onUpdate(n => ({ ...n, color: c })); }
  function setLineText(id, text) {
    onUpdate(n => ({ ...n, lines: n.lines.map(l => l.id === id ? { ...l, text } : l) }));
  }
  function setLineType(id, type) {
    onUpdate(n => ({ ...n, lines: n.lines.map(l => l.id === id ? { ...l, type } : l) }));
  }
  function toggleTaskLine(id) {
    onUpdate(n => ({ ...n, lines: n.lines.map(l => l.id === id ? { ...l, done: !l.done } : l) }));
  }
  function addLineAfter(id, type = 'p') {
    const newL = { id: uid(), type, text: '' };
    onUpdate(n => {
      const idx = n.lines.findIndex(l => l.id === id);
      const lines = [...n.lines];
      lines.splice(idx + 1, 0, newL);
      return { ...n, lines };
    });
    // focus next line
    setTimeout(() => {
      const el = document.querySelector(`[data-line-id="${newL.id}"] .line-text`);
      el && el.focus();
    }, 30);
  }
  function removeLine(id) {
    onUpdate(n => ({ ...n, lines: n.lines.length > 1 ? n.lines.filter(l => l.id !== id) : n.lines }));
  }
  function setLines(nextLines) {
    onUpdate(n => ({ ...n, lines: nextLines }));
  }
  const { getHandleProps, dragState } = useReorder(note.lines, setLines);

  return (
    <div className="note-doc" style={{ background: CAT_COLOR_BG[note.color] }}>
      <div className="note-doc-head">
        {editing ? (
          <input
            className="note-title-input"
            value={note.title}
            onChange={(e) => setTitle(e.target.value)}
            dir={isRTL(note.title) ? 'rtl' : 'ltr'}
          />
        ) : (
          <h1 className="note-title-read" dir={isRTL(note.title) ? 'rtl' : 'ltr'}>{note.title}</h1>
        )}
        <button
          className={`btn tiny ${editing ? 'dark' : ''}`}
          onClick={() => { setEditing(v => !v); setOpenMenu(null); }}
        >
          {editing ? 'Done' : (
            <>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                <path d="M8.5 1.5l2 2-6.5 6.5-2.3.3.3-2.3 6.5-6.5z" stroke="currentColor" strokeWidth="1.1" strokeLinejoin="round"/>
              </svg>
              Edit
            </>
          )}
        </button>
      </div>
      <div className="note-meta">
        <span>Updated {relTime(note.updated)}</span>
        <span>·</span>
        <span>{note.lines.length} lines</span>
        {editing && (
          <div className="color-pick">
            {NOTE_COLORS.map(c => (
              <div key={c}
                className={`color-dot ${note.color === c ? 'active' : ''}`}
                style={{ background: CAT_COLOR_BG[c] }}
                onClick={() => setColor(c)}
              />
            ))}
          </div>
        )}
      </div>

      <div className="note-body">
        {editing ? note.lines.map((l, i) => {
          const isDragging = dragState.draggingId === l.id;
          const isOver = dragState.overId === l.id && !isDragging;
          const overBelow = isOver && note.lines.findIndex(x => x.id === l.id) > note.lines.findIndex(x => x.id === dragState.draggingId);
          return (
          <div key={l.id}
            className={[
              'note-line',
              l.done ? 'done' : '',
              isDragging ? 'reorder-dragging' : '',
              isOver ? `reorder-over ${overBelow ? 'reorder-over-below' : ''}` : '',
            ].filter(Boolean).join(' ')}
            data-type={l.type}
            data-line-id={l.id}
            data-reorder-id={l.id}
          >
            <span className="line-handle" {...getHandleProps(l.id)}>⠿</span>
            {l.type === 't' && (
              <div className="task-tick" onClick={() => toggleTaskLine(l.id)}>
                {l.done && <svg width="10" height="10" viewBox="0 0 11 11"><path d="M2 6l2.5 2.5L9 3" stroke="#fbf9f4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/></svg>}
              </div>
            )}
            <div
              className={`line-text ${isRTL(l.text) ? 'rtl' : ''}`}
              contentEditable
              suppressContentEditableWarning
              data-ph={PLACEHOLDER[l.type] || 'Type…'}
              onBlur={(e) => setLineText(l.id, e.currentTarget.textContent)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') {
                  e.preventDefault();
                  setLineText(l.id, e.currentTarget.textContent);
                  addLineAfter(l.id, l.type === 'h' ? 'p' : l.type);
                } else if (e.key === 'Backspace' && e.currentTarget.textContent === '') {
                  e.preventDefault();
                  removeLine(l.id);
                }
              }}
              dangerouslySetInnerHTML={{ __html: l.text }}
            />
            <div className="line-menu" onClick={() => setOpenMenu(openMenu === l.id ? null : l.id)}>⋯</div>
            {openMenu === l.id && (
              <div style={{ position: 'absolute', left: -8, top: 28, background: 'var(--paper)', border: '1px solid var(--line)', borderRadius: 10, padding: 6, display: 'flex', gap: 4, zIndex: 50, boxShadow: '0 8px 24px rgba(0,0,0,0.12)' }}>
                {LINE_TYPES.map(t => (
                  <button key={t.id}
                    className="tool-btn"
                    title={t.tip}
                    style={{ background: l.type === t.id ? 'var(--ink)' : 'rgba(0,0,0,0.04)', color: l.type === t.id ? 'var(--paper)' : 'var(--ink)' }}
                    onClick={() => { setLineType(l.id, t.id); setOpenMenu(null); }}
                  >{t.label}</button>
                ))}
                <button className="tool-btn" onClick={() => { removeLine(l.id); setOpenMenu(null); }} style={{ color: '#a00' }}>✕</button>
              </div>
            )}
          </div>
          );
        }) : note.lines.map(l => (
          <div key={l.id}
            className={`note-line read ${l.done ? 'done' : ''}`}
            data-type={l.type}
          >
            {l.type === 't' && (
              <div className="task-tick" onClick={() => toggleTaskLine(l.id)}>
                {l.done && <svg width="10" height="10" viewBox="0 0 11 11"><path d="M2 6l2.5 2.5L9 3" stroke="#fbf9f4" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/></svg>}
              </div>
            )}
            <div
              className={`line-text ${isRTL(l.text) ? 'rtl' : ''}`}
              dangerouslySetInnerHTML={{ __html: l.text || '&nbsp;' }}
            />
          </div>
        ))}
      </div>

      {editing && (
      <div className="note-toolbar">
        {LINE_TYPES.map(t => (
          <button key={t.id} className="tool-btn" title={t.tip}
            onClick={() => {
              const last = note.lines[note.lines.length - 1];
              if (last.text === '') setLineType(last.id, t.id);
              else addLineAfter(last.id, t.id);
            }}>
            {t.label}
          </button>
        ))}
        <div style={{ flex: 1 }} />
        <button className="tool-btn" onClick={onDelete} style={{ color: '#a00' }}>Delete note</button>
      </div>
      )}
    </div>
  );
}

Object.assign(window, { Notes });

</script>
