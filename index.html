<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keeper</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Keeper">
<meta name="theme-color" content="#f0ebe3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── Personal Dashboard — Warm Beige + #0066CC ─── */
:root {
  --bg:       #f0ebe3;
  --bg-2:     #e5ddd4;
  --paper:    #faf7f2;
  --ink:      #2c1a0e;
  --ink-2:    #4a3728;
  --muted:    #8a7060;
  --muted-2:  #b8a898;
  --line:     #e0d8ce;
  --line-2:   #cfc5b8;

  --accent:       #0066CC;
  --accent-hover: #0055AA;
  --accent-light: #e8f1fa;
  --accent-mid:   #B3D1F0;
  --accent-text:  #004499;

  --green:       #34C759;
  --green-light: #e8f8ed;
  --orange:      #FF9500;
  --orange-light:#fff4e0;
  --red:         #FF3B30;
  --red-light:   #ffebe9;
  --purple:      #AF52DE;

  --peach:       #f5dcc8;
  --peach-deep:  #B5622B;
  --mint:        #c8e6d0;
  --mint-deep:   #2E7D52;
  --sky:         #cce0f5;
  --sky-deep:    #0066CC;
  --coral:       #f5ccc8;
  --coral-deep:  #B94040;
  --butter:      #f5eabc;
  --butter-deep: #9A7528;
  --lilac:       #e0d4f5;
  --lilac-deep:  #7A57C0;
  --sand:        #d4bfa0;
  --sand-deep:   #7a5c3a;

  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm:  8px;
  --radius-xs:  6px;

  /* Type system: Manrope = UI, Fraunces = display/expressive, JetBrains Mono = data */
  --font-ui:      'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Fraunces', 'Instrument Serif', Georgia, serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;

  --shadow-card:       0 1px 2px rgba(44,26,14,0.05), 0 4px 16px rgba(44,26,14,0.07);
  --shadow-card-hover: 0 2px 4px rgba(44,26,14,0.06), 0 8px 22px rgba(44,26,14,0.10);

  /* 3D treatment tokens — gradient fill + inset top highlight + tinted drop shadow */
  --grad-accent:       linear-gradient(180deg, #1a79dd, #0060c0);
  --grad-accent-hover: linear-gradient(180deg, #0f6ed2, #0055ab);
  --grad-red:          linear-gradient(180deg, #ff6156, #e0352a);
  --grad-ink:          linear-gradient(180deg, #5a4433, #3b2b1d);
  --bevel-btn:    inset 0 1px 0 rgba(255,255,255,0.65), 0 1px 2px rgba(44,26,14,0.10);
  --bevel-accent: inset 0 1px 0 rgba(255,255,255,0.28), 0 2px 6px rgba(0,102,204,0.32);
  --bevel-red:    inset 0 1px 0 rgba(255,255,255,0.30), 0 2px 6px rgba(224,53,42,0.30);
  --bevel-chip:   inset 0 1px 0 rgba(255,255,255,0.30), 0 1px 3px rgba(44,26,14,0.16);
  --bevel-soft:   inset 0 1px 0 rgba(255,255,255,0.55), 0 1px 2px rgba(44,26,14,0.07);
  --grad-green:       linear-gradient(180deg, #3fcf6a, #27a84f);
  --grad-red-hover:   linear-gradient(180deg, #f0493d, #c92a20);
  --bevel-green:  inset 0 1px 0 rgba(255,255,255,0.30), 0 2px 6px rgba(39,168,79,0.32);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
}

body {
  background: var(--bg);
  padding: 0;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── macOS window shell ── */
.mac-shell {
  width: 100vw;
  height: 100vh;
  border-radius: 0;
  background: var(--bg);
  box-shadow: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.mac-titlebar { display: none; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.tl-dot.red    { background: #ff5f57; border: 0.5px solid rgba(0,0,0,0.12); }
.tl-dot.yellow { background: #febc2e; border: 0.5px solid rgba(0,0,0,0.10); }
.tl-dot.green  { background: #28c840; border: 0.5px solid rgba(0,0,0,0.10); }

.mac-title {
  flex: 1; text-align: center; font-size: 13px; font-weight: 500;
  color: var(--muted); letter-spacing: -0.1px;
}
.mac-title b { color: var(--ink); font-weight: 600; }
.mac-body { flex: 1; display: flex; min-height: 0; }

/* ── Sidebar ── */
.sidebar {
  width: 190px; flex-shrink: 0;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 12px 8px;
}

.brand { display: flex; align-items: center; gap: 8px; padding: 2px 4px 14px; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 6px; background: var(--accent);
  display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px;
}
.brand-mark span { border-radius: 1.5px; }
.brand-mark span:nth-child(1) { background: rgba(255,255,255,0.92); }
.brand-mark span:nth-child(2) { background: rgba(255,255,255,0.55); }
.brand-mark span:nth-child(3) { background: rgba(255,255,255,0.55); }
.brand-mark span:nth-child(4) { background: rgba(255,255,255,0.28); }

.brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; color: var(--ink); }
.brand-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.6px; text-transform: uppercase; margin-top: 1px; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 7px; cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  transition: background 80ms; user-select: none;
}
.nav-item:hover { background: var(--bg); }
.nav-item.active { background: var(--accent-light); color: var(--accent-text); font-weight: 600; }

.nav-icon { width: 20px; height: 20px; display: grid; place-items: center; flex-shrink: 0; color: var(--muted); }
.nav-item.active .nav-icon { color: var(--accent); }
.nav-chip { width: 16px; height: 16px; border-radius: 5px; flex-shrink: 0; }
.nav-count { display: none; }

.sidebar-foot { display: none; }
.sidebar-foot-dot { margin-top: auto; padding: 14px 14px 18px; display: flex; align-items: center; }
.avatar   { display: none; }
.who-name { display: none; }
.who-sub  { display: none; }

/* ── Main panel ── */
.main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg); }
.main-inner { padding: 26px 30px 80px; max-width: 1080px; margin: 0 auto; }

/* ── Home greeting ── */
.h-greet {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 24px; margin-bottom: 26px;
}
.h-greet h1 { flex: 1; margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
.h-greet h1 em { font-style: normal; font-weight: 300; font-size: 26px; color: var(--muted); }
.h-date {
  padding-top: 8px; font-family: var(--font-mono);
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1.1px; white-space: nowrap;
}

/* ── Cards ── */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-card); }
.block {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 20px; position: relative; overflow: hidden; box-shadow: var(--shadow-card);
}
.block.sky    { background: var(--sky);    border-color: rgba(0,102,204,0.22); }
.block.peach  { background: var(--peach);  border-color: rgba(181,98,43,0.20); }
.block.mint   { background: var(--mint);   border-color: rgba(46,125,82,0.20); }
.block.coral  { background: var(--coral);  border-color: rgba(185,64,64,0.20); }
.block.butter { background: var(--butter); border-color: rgba(154,117,40,0.20); }
.block.lilac  { background: var(--lilac);  border-color: rgba(122,87,192,0.20); }
.block.sand   { background: var(--sand);   border-color: rgba(122,92,58,0.20); }

.home-widget-wrap .block { transition: transform 150ms ease, box-shadow 150ms ease; }
.home-widget-wrap:hover .block { transform: translateY(-1px); box-shadow: var(--shadow-card-hover); }
@media (prefers-reduced-motion: reduce) {
  .home-widget-wrap .block, .btn, .quote-refresh-btn { transition: none !important; }
}

.block-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}
.block-label::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; font: inherit; font-size: 13px; font-weight: 600;
  border-radius: 10px; border: 1px solid #c9beb0;
  background: var(--paper); color: var(--ink); cursor: pointer;
  box-shadow: var(--bevel-btn);
  transition: background 120ms, transform 120ms, box-shadow 120ms;
  white-space: nowrap; user-select: none;
}
.btn:hover   { background: var(--bg-2); }
.btn:active  { transform: scale(0.97); }
.btn.dark    {
  background: var(--grad-accent); color: #fff; border-color: transparent;
  box-shadow: var(--bevel-accent);
}
.btn.dark:hover { background: var(--grad-accent-hover); }
.btn.ghost   { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-light); }
.btn.tiny    { padding: 4px 9px; font-size: 12px; border-radius: 8px; }

/* One focus ring for everything interactive */
.btn:focus-visible, .add-col-btn:focus-visible, .checkbox:focus-visible,
.mobile-tab:focus-visible, .nav-item:focus-visible, .tool-btn:focus-visible,
.quote-refresh-btn:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.input {
  font: inherit; font-size: 14px; width: 100%; padding: 9px 12px;
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--paper); color: var(--ink); outline: none;
  transition: border-color 80ms, box-shadow 80ms;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,102,204,0.12); }
.input::placeholder { color: var(--muted-2); }
.input.input-sm { font-size: 13px; padding: 7px 10px; }

/* ── Page heading ── */
.page-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
}
.page-head h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; margin: 0; }
.page-head .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ── Shopping ── */
.shop-layout { display: flex; flex-direction: column; gap: 14px; }
.shop-list { display: flex; flex-direction: column; gap: 14px; }
.cat-block {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 14px 14px 10px; box-shadow: var(--shadow-card);
}
.cat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: nowrap; }
.cat-name {
  font-size: 15px; font-weight: 700; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto;
}
/* Long names truncate so the header controls never wrap */
.cat-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cat-del-btn {
  width: 22px; height: 22px; border: none; background: transparent; border-radius: 6px;
  color: var(--muted-2); cursor: pointer; flex-shrink: 0; display: grid; place-items: center;
}
.cat-del-btn:hover { background: var(--red-light); color: var(--red); }
.cat-drag-handle { opacity: 0; transition: opacity 100ms; }
.cat-block:hover .cat-drag-handle { opacity: 1; }
@media (max-width: 680px) {
  .cat-drag-handle { opacity: 0.55; }
  .cat-clear-word { display: none; }
  .cat-clear-btn { padding: 3px 8px; }
}
.cat-name-pencil { color: var(--muted-2); opacity: 0; transition: opacity 100ms; flex-shrink: 0; }
.cat-name:hover .cat-name-pencil { opacity: 1; }
.cat-name-input {
  font: inherit; font-size: 15px; font-weight: 700; border: 1px solid var(--accent);
  border-radius: 6px; padding: 2px 8px; outline: none; background: var(--paper); color: var(--ink);
  box-shadow: 0 0 0 3px rgba(0,102,204,0.12); min-width: 0; flex: 1;
}
.cat-head-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
/* Header pills share the blue 3D language of the add / new-category buttons */
.cat-count {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600; padding: 4px 9px; flex-shrink: 0; cursor: pointer;
  background: var(--grad-green); border: none; border-radius: 8px; color: #fff;
  box-shadow: var(--bevel-green);
}
.cat-clear-btn {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  padding: 4px 10px; flex-shrink: 0; white-space: nowrap; cursor: pointer;
  background: var(--grad-red); border: none; border-radius: 8px;
  color: #fff; box-shadow: var(--bevel-red);
  transition: transform 100ms, background 120ms;
}
.cat-clear-btn:hover { background: var(--grad-red-hover); }
.cat-clear-btn:active { transform: scale(0.95); }
/* In-header add button (shopping categories, task columns) */
.add-col-btn.head-add { padding: 4px 10px; font-size: 11.5px; border-radius: 8px; flex-shrink: 0; }
@media (max-width: 680px) {
  .head-add-word { display: none; }
}

/* ── Shopping / Task item rows ── */
.item-row {
  position: relative; overflow: hidden;
  border-radius: 8px; margin-bottom: 5px;
}
.item-row.done .item-name { text-decoration: line-through; opacity: 0.4; }
.item-row.done .task-text { text-decoration: line-through; }

/* Swipe actions — hidden by default, revealed on mobile via translateX */
.item-swipe-actions {
  display: none;
  position: absolute; top: 0; right: 0; bottom: 0; width: 104px;
}
.item-swipe-btn {
  flex: 1; border: none; display: grid; place-items: center; cursor: pointer; color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
}
.item-swipe-btn.search { background: var(--grad-ink); }
.item-swipe-btn.edit   { background: var(--grad-accent); }
.item-swipe-btn.delete { background: var(--grad-red); }

/* Body — covers full row width so actions never peek through */
.item-swipe-body {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 9px 11px;
  background: rgba(255,255,255,0.72);
  min-width: 100%;
  box-sizing: border-box;
  transition: transform 160ms cubic-bezier(.2,.8,.3,1);
  touch-action: pan-y;
}

.item-name { flex: 1; font-size: 14px; cursor: pointer; user-select: none; }
.item-name:hover { color: var(--accent); }
.item-qty {
  font-family: var(--font-mono);
  font-size: 11px; padding: 2px 8px; border-radius: 999px; cursor: pointer;
  background: var(--grad-accent); color: #fff; border: none; font-weight: 500;
  box-shadow: var(--bevel-chip);
}
.item-qty.add { background: rgba(0,0,0,0.09); color: var(--muted); box-shadow: none; }

/* Desktop inline action buttons — small colored pills */
.item-action-btn {
  width: 26px; height: 26px; border-radius: 7px; border: none;
  display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  box-shadow: var(--bevel-chip); transition: transform 100ms;
}
.item-action-btn:active { transform: scale(0.92); }
.item-action-btn.search { background: var(--grad-ink);    color: #fff; }
.item-action-btn.edit   { background: var(--grad-accent); color: #fff; }
.item-action-btn.delete { background: var(--grad-red);    color: #fff; }

/* Mobile: show swipe actions, hide ALL desktop inline controls inside the body.
   The body must be fully opaque + full width to cover the swipe actions underneath.
   We hide the qty pill and action buttons — they're replaced by the swipe actions. */
@media (max-width: 680px) {
  .item-swipe-actions { display: flex; }
  .item-swipe-body {
    width: 100%;
    background: rgba(255,255,255,0.96); /* near-opaque: fully covers the colored actions behind */
  }
  .item-action-btn { display: none !important; }
  .item-qty { display: none !important; }
}

.checkbox {
  width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid var(--line-2); background: var(--paper);
  cursor: pointer; flex-shrink: 0; display: grid; place-items: center;
  transition: background 80ms, border-color 80ms;
}
.checkbox:hover { border-color: var(--accent); }
.checkbox.checked { background: var(--grad-accent); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,0.30), 0 1px 2px rgba(0,102,204,0.25); }
.checkbox svg { opacity: 0; }
.checkbox.checked svg { opacity: 1; }

.add-row {
  display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 8px;
  background: var(--bg); border-radius: var(--radius-sm); border: 1px dashed var(--line-2);
}
.add-row input { flex: 1; border: none; background: transparent; outline: none; font: inherit; font-size: 13px; color: var(--ink); }

/* ── New category modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 12px; box-sizing: border-box; }
.modal-card { width: 100%; max-width: 340px; background: var(--paper); border-radius: var(--radius-lg); padding: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.25); box-sizing: border-box; overflow: hidden; }
.modal-card h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 12px; }
.modal-color-grid { display: flex; gap: 8px; margin: 14px 0 20px; flex-wrap: wrap; }
.modal-color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 100ms; }
.modal-color-swatch:hover { transform: scale(1.1); }
.modal-color-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* ── Shopping preview (legacy, kept for compat) ── */
.preview-panel { position: sticky; top: 0; border-radius: var(--radius-lg); background: var(--paper); border: 1px solid var(--line); padding: 16px; box-shadow: var(--shadow-card); }
.preview-img { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md); background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; }
.preview-img img { width: 100%; height: 100%; object-fit: cover; }
.preview-empty { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: center; padding: 0 20px; line-height: 1.8; }
.preview-title { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 4px; }
.preview-meta  { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.preview-actions { display: flex; gap: 7px; flex-wrap: wrap; }

/* ── Tasks ── */
.tasks-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.task-col {
  border-radius: var(--radius-lg); padding: 0; display: flex; flex-direction: column;
  min-height: 200px; border: 1px solid var(--line);
  box-shadow: var(--shadow-card); overflow: hidden;
}
.task-col-body { flex: 1; overflow-y: auto; min-height: 0; padding: 0 14px; }
.task-composer-wrap { padding: 0 14px 14px; }
.task-col-inner { flex: 1; display: flex; flex-direction: column; padding: 14px 14px 12px; }
.task-col-accent-bar { height: 4px; flex-shrink: 0; }
.task-col-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding: 14px 14px 0;
}
.task-col-title { font-size: 15px; font-weight: 700; }
.task-col-sub {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 4px 9px;
  background: var(--grad-green); border: none; border-radius: 8px; color: #fff;
  box-shadow: var(--bevel-green); white-space: nowrap;
}

.task-card { /* uses .item-row + .item-swipe-body shared classes */ }
.task-card.done  { opacity: 0.48; }
.task-text { flex: 1; font-size: 14px; line-height: 1.4; word-break: break-word; }

.task-due {
  font-family: var(--font-mono);
  font-size: 10.5px; margin-top: 5px; display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 999px; background: var(--bg-2); color: var(--muted);
  box-shadow: var(--bevel-soft);
}
.task-due.overdue { background: var(--grad-red); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.30), 0 1px 3px rgba(224,53,42,0.30); }
.task-due.today   { background: var(--grad-accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.30), 0 1px 3px rgba(0,102,204,0.30); }

.add-col-btn-row {
  display: flex; justify-content: flex-end; padding: 6px 14px 14px;
}
.add-col-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; background: var(--grad-accent); color: #fff; border: none;
  border-radius: 9px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
  box-shadow: var(--bevel-accent);
  transition: background 120ms, transform 120ms;
}
.add-col-btn:hover { background: var(--grad-accent-hover); }
.add-col-btn:active { transform: scale(0.97); }

/* ── Collapsible bubbles (shopping categories, task columns) ── */
.collapse-btn {
  width: 24px; height: 24px; border: none; background: transparent; border-radius: 6px;
  color: var(--muted); font-size: 11px; cursor: pointer; flex-shrink: 0;
}
.collapse-btn:hover { background: var(--bg); }
.cat-block.collapsed { padding-bottom: 12px; }
.cat-block.collapsed .cat-head { margin-bottom: 0; }
.task-col.collapsed { min-height: 0; }
.task-col.collapsed .task-col-head { margin-bottom: 0; padding-bottom: 14px; }

/* Pill buttons — Pin/Unpin, Show/Hide (shared by app.jsx + home.jsx) */
.pill-btn {
  padding: 4px 12px; border-radius: 999px; border: none; cursor: pointer;
  font: inherit; font-size: 11px; font-weight: 600;
  transition: transform 100ms, background 120ms;
}
.pill-btn:active  { transform: scale(0.95); }
.pill-btn.accent  { background: var(--grad-accent); color: #fff; box-shadow: var(--bevel-chip); }
.pill-btn.red     { background: var(--grad-red);    color: #fff; box-shadow: var(--bevel-chip); }
.pill-btn.neutral { background: var(--bg-2); color: var(--muted); box-shadow: var(--bevel-soft); }

.notes-mobile-back {
  display: none;
}
.note-list-handle {
  opacity: 0; flex-shrink: 0;
}
.note-tab:hover .note-list-handle { opacity: 1; }

/* ── Notes ── */
.notes-layout { display: grid; grid-template-columns: 256px 1fr; gap: 16px; align-items: start; }
.notes-list { display: flex; flex-direction: column; gap: 3px; }
.note-search { position: sticky; top: 0; background: var(--bg); padding-bottom: 9px; margin-bottom: 3px; }
.note-search input {
  width: 100%; border: 1px solid var(--line-2); background: var(--paper);
  font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; outline: none; color: var(--ink);
}
.note-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,102,204,0.10); }

.note-tab {
  padding: 10px 12px; border-radius: 12px; cursor: pointer;
  display: flex; align-items: flex-start; gap: 9px;
  border: 1px solid transparent; transition: background 80ms, box-shadow 120ms;
}
.note-tab:hover { background: var(--paper); border-color: var(--line); }
.note-tab.active { background: var(--paper); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-mid); }
.note-swatch { width: 4px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
.note-tab-inner { flex: 1; min-width: 0; }
.note-tab-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-tab-snip { font-size: 12px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.note-doc {
  padding: 2px 18px 24px; display: flex; flex-direction: column;
  border-left: 1px solid var(--line); border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
}
.note-doc-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.note-doc-head .btn { margin-top: 8px; flex-shrink: 0; }
.note-title-read {
  flex: 1; min-width: 0; overflow-wrap: break-word;
  font-family: var(--font-display); font-size: 30px; font-weight: 600;
  letter-spacing: -0.3px; line-height: 1.2; margin: 0; color: var(--ink);
}
.note-title-input {
  flex: 1; min-width: 0;
  font-family: var(--font-display); font-size: 30px; font-weight: 600; letter-spacing: -0.3px;
  border: none; outline: none; background: transparent; color: var(--ink);
  border-bottom: 2px dashed var(--line-2); padding-bottom: 2px;
}
.note-meta {
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px;
  margin-bottom: 14px; display: flex; gap: 10px; align-items: center;
  border-bottom: 1px solid var(--line); padding-bottom: 10px;
}
.color-pick { display: flex; gap: 5px; margin-left: auto; }
.color-dot { width: 13px; height: 13px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 80ms; }
.color-dot:hover { transform: scale(1.18); }
.color-dot.active { border-color: var(--ink); }

.note-body { font-size: 15.5px; line-height: 1.75; color: var(--ink); }
.note-line {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 3px 0; border-radius: 5px; position: relative;
}
.note-line:hover { background: rgba(255,255,255,0.55); }
.note-line .line-handle { width: 14px; color: var(--muted-2); font-size: 9px; padding-top: 5px; opacity: 0; cursor: grab; user-select: none; flex-shrink: 0; touch-action: none; }
.note-line:hover .line-handle { opacity: 1; }
@media (max-width: 680px) {
  .note-line .line-handle { opacity: 0.6; width: 20px; }
}
.note-line[data-type="h"]  { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.3px; margin-top: 16px; }
.note-line[data-type="sh"] { font-size: 15px; font-weight: 700; margin-top: 10px; text-transform: none; }
/* Read mode: quiet document — no hover chrome, no placeholders */
.note-line.read:hover { background: transparent; }
.note-line.read .line-text { cursor: default; }
.note-line.read .line-text:empty::before { content: none; }
.note-line[data-type="b"]::before { content: "•"; color: var(--muted); }
.note-line[data-type="t"] { padding-left: 24px; position: relative; }
.note-line[data-type="t"] .task-tick {
  position: absolute; left: 0; top: 5px; width: 15px; height: 15px;
  border-radius: 4px; border: 1.5px solid var(--line-2); cursor: pointer;
  display: grid; place-items: center;
}
.note-line[data-type="t"].done .task-tick { background: var(--grad-accent); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,0.30); }
.note-line[data-type="t"].done .line-text { text-decoration: line-through; opacity: 0.5; }
.line-text { flex: 1; outline: none; min-height: 1.4em; }
.line-text:empty::before { content: attr(data-ph); color: var(--muted-2); }
.rtl { direction: rtl; text-align: right; }
.line-menu {
  position: absolute; left: -28px; top: 3px; width: 22px; height: 22px;
  border-radius: 6px; background: var(--paper); border: 1px solid var(--line);
  display: grid; place-items: center; cursor: pointer; opacity: 0; font-size: 13px; color: var(--muted);
}
.note-line:hover .line-menu { opacity: 1; }
.note-toolbar {
  position: sticky; bottom: 8px; margin-top: 16px; display: flex; gap: 6px; padding: 8px;
  background: rgba(255,255,255,0.80); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(0,0,0,0.09); border-radius: 13px;
  box-shadow: 0 4px 16px rgba(44,26,14,0.10);
}
.tool-btn {
  padding: 4px 9px; border-radius: 7px; background: var(--bg); font-size: 12px; cursor: pointer;
  font-family: var(--font-mono); border: 1px solid var(--line); color: var(--ink);
  box-shadow: var(--bevel-soft); transition: transform 100ms, background 100ms;
}
.tool-btn:active { transform: scale(0.95); }
.tool-btn:hover { background: var(--accent-light); border-color: var(--accent-mid); color: var(--accent); }

/* ── Quotes ── */
.quotes-stage {
  background: var(--paper); border-radius: var(--radius-lg);
  padding: 48px 44px; text-align: center;
  border: 1px solid var(--line); box-shadow: var(--shadow-card);
  position: relative; overflow: hidden;
}
.quotes-stage::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--accent-light) 0%, transparent 58%);
  pointer-events: none;
}
.quote-mark {
  font-size: 120px; line-height: 1; color: var(--accent);
  position: absolute; left: 22px; top: -14px; opacity: 0.09;
  font-family: var(--font-display);
}
.quote-mark.r { left: auto; right: 22px; top: auto; bottom: -42px; transform: rotate(180deg); }
.quote-text { font-family: var(--font-display); font-size: 27px; font-weight: 400; line-height: 1.4; letter-spacing: -0.2px; max-width: 680px; margin: 0 auto 18px; position: relative; color: var(--ink); }
.quote-attrib { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 1.4px; text-transform: uppercase; position: relative; }
.quote-bar { display: flex; justify-content: center; gap: 10px; margin-top: 22px; position: relative; }
.quote-list { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.quote-chip {
  position: relative;
  border-radius: var(--radius-md); padding: 12px 14px 12px 30px; font-size: 14px; line-height: 1.4;
  cursor: pointer; border: 1px solid var(--line); background: var(--paper);
  transition: border-color 80ms, box-shadow 80ms; text-align: left;
}
.quote-chip:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-mid); }
.quote-chip .qa { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 7px; }
.quote-chip-handle { position: absolute; left: 6px; top: 12px; opacity: 0; }
.quote-chip:hover .quote-chip-handle { opacity: 1; }
@media (max-width: 680px) {
  .quote-chip-handle { opacity: 0.6; }
}

/* ── Drag / sortable ── */
.sort-handle {
  position: absolute; top: 10px; right: 10px;
  font-family: var(--font-mono);
  font-size: 9px; color: var(--muted-2); cursor: grab;
  padding: 2px 5px; border-radius: 4px;
  background: rgba(255,255,255,0.75); border: 1px solid var(--line);
  opacity: 0; transition: opacity 100ms; letter-spacing: 0.3px;
}
.block:hover .sort-handle { opacity: 1; }
.dragging { opacity: 0.5; }

/* ── Finance lock ── */
.fin-lock {
  width: 360px; max-width: 100%; text-align: center; background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 36px 32px 28px; box-shadow: var(--shadow-card);
}
.fin-lock.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.fin-lock h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 12px 0 6px; }
.fin-lock p  { color: var(--muted); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
.fin-lock input {
  width: 100%; font-size: 22px; font-family: var(--font-mono);
  text-align: center; letter-spacing: 8px; padding: 12px;
  border: 1px solid var(--line-2); border-radius: 10px; outline: none;
  background: var(--bg); margin-bottom: 12px; color: var(--ink);
}
.fin-lock input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,102,204,0.12); }
.fin-lock input.err   { border-color: var(--red); background: var(--red-light); }
.fin-lock button { width: 100%; padding: 11px; font-size: 14px; }
.fin-lock-hint { font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); letter-spacing: 0.8px; text-transform: uppercase; margin-top: 16px; }
.fin-lock-art { width: 52px; margin: 0 auto; }
.fin-lock-shackle { width: 30px; height: 26px; border: 3.5px solid var(--accent); border-bottom: none; border-radius: 15px 15px 0 0; margin: 0 auto; }
.fin-lock-body { width: 46px; height: 33px; background: var(--accent); border-radius: 8px; margin: -2px auto 0; display: grid; place-items: center; }
.fin-lock-keyhole { width: 8px; height: 8px; background: var(--paper); border-radius: 50%; position: relative; }
.fin-lock-keyhole::after { content: ''; position: absolute; top: 6px; left: 3px; width: 2px; height: 8px; background: var(--paper); }

/* ── Finance view ── */
.fx-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: var(--paper); border: 1px solid var(--line-2); font-size: 12px; box-shadow: var(--bevel-btn); }
.fx-label { color: var(--muted); }
.fx-val   { font-weight: 600; cursor: pointer; border-bottom: 1px dashed var(--line-2); }
.fx-val:hover { color: var(--accent); border-color: var(--accent); }
.fx-pill input { width: 54px; font: inherit; font-weight: 600; border: none; outline: none; background: transparent; }

.fin-hero  { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; margin-bottom: 18px; }
.fin-big   { font-size: 44px; font-weight: 700; letter-spacing: -1.8px; line-height: 1; margin: 8px 0 14px; font-variant-numeric: tabular-nums; }
.fin-sub-stack { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.80); }
.fin-sub-stack .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.fin-sub-stack .dot.mint  { background: var(--green); }
.fin-sub-stack .dot.peach { background: var(--orange); }
.fin-sub-stack .dot.lilac { background: #c084f5; }
.fin-debt { margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); font-size: 12px; font-family: var(--font-mono); color: #ffa09a; }

.fin-section       { margin-bottom: 20px; }
.fin-section.compact { margin-bottom: 0; }
.fin-section-head  { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
.fin-section-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.fin-section-sub   { font-size: 13px; color: var(--muted); }

.fin-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.fin-acct  { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; position: relative; overflow: hidden; }
.fin-acct::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); }
.fin-acct.savings::before { background: var(--green); }
.fin-acct.broker::before  { background: var(--orange); }
.fin-acct.credit::before  { background: var(--red); }
.fin-acct.neg  { background: var(--red-light); }
.fin-acct-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.fin-acct-name { font-size: 13px; font-weight: 500; line-height: 1.3; flex: 1; }
.fin-acct-kind { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); padding-top: 2px; }
.fin-acct-amt  { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.fin-acct.neg .fin-acct-amt { color: var(--red); }
.fin-acct-ils  { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; }

.fin-table { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
.fin-row   { display: grid; grid-template-columns: 1fr 55px 120px; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); position: relative; font-size: 13.5px; }
.fin-row:last-child { border-bottom: none; }
/* 2-col variant for sections without % (pension, RSU, bank) */
.fin-row-2col { display: grid; grid-template-columns: 1fr 140px; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); position: relative; font-size: 13.5px; }
.fin-row-2col:last-child { border-bottom: none; }
.fin-row.total { background: var(--bg); font-weight: 700; }
.fin-row.frozen .fin-row-name { color: var(--muted); }
.fin-row-bar     { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); opacity: 0.3; }
.fin-row-name    { font-weight: 500; }
.fin-row-note    { font-size: 12px; color: var(--muted); margin-top: 2px; }
.fin-row-pct     { font-size: 12px; color: var(--muted); text-align: right; }
.fin-row-amt     { font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.fin-row-updated { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: right; text-transform: uppercase; }
/* USD inline sub-amount */
.fin-row-usd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }

.fin-twoup { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.fin-foot  { margin-top: 16px; padding: 12px; text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; border-top: 1px dashed var(--line); }

[data-hide="true"] { filter: blur(8px); transition: filter 200ms; cursor: pointer; user-select: none; }
[data-hide="true"]:hover { filter: blur(4px); }

/* IBKR dual currency */
.fin-dual-amt  { font-weight: 600; color: var(--ink); }
.fin-dual-sep  { color: var(--muted-2); margin: 0 2px; }
.fin-dual-conv { color: var(--muted); font-size: 10px; margin-left: 4px; }

/* ── Drag-to-reorder (shared: shopping items, task cards, note lines, quote chips) ── */
.reorder-handle {
  width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px;
  display: grid; place-items: center; cursor: grab;
  color: var(--muted-2); font-size: 11px; line-height: 1;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.reorder-handle:active { cursor: grabbing; }
.reorder-handle:hover { background: var(--bg); color: var(--muted); }
.reorder-dragging { opacity: 0.55; box-shadow: 0 4px 14px rgba(0,0,0,0.14); position: relative; z-index: 5; }
.reorder-over { box-shadow: inset 0 2px 0 var(--accent); }
.reorder-over.reorder-over-below { box-shadow: inset 0 -2px 0 var(--accent); }
@media (max-width: 680px) {
  .reorder-handle { width: 22px; height: 22px; opacity: 1; }
}
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px;
  font-size: 13px; z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  animation: toastIn 200ms ease;
}
@keyframes toastIn { from { transform: translate(-50%, 10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.undo-toast { display: flex; align-items: center; gap: 14px; max-width: min(92vw, 420px); }
.undo-toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.undo-toast button {
  border: none; border-radius: 999px; padding: 4px 13px; cursor: pointer; flex-shrink: 0;
  font: inherit; font-size: 12px; font-weight: 700; color: #fff;
  background: rgba(255,255,255,0.20); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
}
.undo-toast button:active { transform: scale(0.95); }
@media (max-width: 680px) {
  .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
}

/* ── Misc ── */
.muted   { color: var(--muted); }
.sub     { font-size: 13px; color: var(--muted); }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.empty   { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 13px; }

/* ── Sync error banner ── */
.sync-banner {
  position: fixed; top: 0; left: 0; right: 0; background: #dc2626; color: white;
  padding: 12px 16px; font-size: 13px; font-weight: 600; text-align: center;
  z-index: 1000; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); line-height: 1.45;
}
.sync-banner.show { display: block; }
.sync-banner .sync-banner-msg { display: inline; margin-right: 12px; }
.sync-banner-btn { margin-left: 8px; padding: 4px 12px; background: white; color: #dc2626; border: 0; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }
.sync-banner-btn.sync-banner-btn-secondary { background: transparent; color: white; border: 1px solid rgba(255,255,255,.5); }

/* ── Desktop/Mobile layout rules ── */
.desktop-sidebar { display: flex; flex-direction: column; }
.mobile-topbar   { display: none; }
.mobile-tab-bar  { display: none; }
.home-grid { display: flex; flex-direction: column; gap: 16px; }
.home-widget-wrap { position: relative; }
.home-drag-handle {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  opacity: 0; transition: opacity 100ms;
  cursor: grab; font-size: 14px; color: var(--muted);
  padding: 1px 3px; line-height: 1;
}
.home-widget-wrap:hover .home-drag-handle { opacity: 1; }
@media (max-width: 680px) {
  .home-drag-handle { opacity: 0.6; }
}

/* ── Mobile responsive ── */
@media (max-width: 680px) {
  html, body { height: 100dvh; overflow: hidden; }
  .mac-shell { height: 100dvh; width: 100vw; }
  body { padding: 0; }
  .mac-titlebar { display: none; }
  .mac-body { flex-direction: column; overflow: hidden; position: relative; }
  .sidebar { display: none !important; }
  .mobile-topbar { display: none !important; }
  .main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  /* Standalone PWA extends under the iOS status bar — pad it out */
  .main-inner { padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(100px + env(safe-area-inset-bottom, 0px)); }

  /* iOS auto-zooms the page when focusing any field under 16px — pin fields
     at 16px on mobile so the layout never zoom-shifts off screen. */
  input, textarea, select { font-size: 16px !important; }
  .line-text { font-size: 16px !important; }
  .note-body { font-size: 16px; }
  .note-line[data-type="sh"] { font-size: 16px; }

  /* Standalone iOS ignores user-scalable=no — a stray double-tap zooms the
     page and content "spills" off-screen. touch-action:manipulation disables
     double-tap zoom; the class-level pan-y/none rules for swipe rows and
     drag handles still win over this universal rule. */
  * { touch-action: manipulation; }

  /* Room for the keyboard when the pan-guard scrolls a focused field into
     view inside .main (see the keyboard-guard script in the page shell). */
  .main { scroll-padding: 120px 0 340px 0; }
  .note-title-input { font-size: 26px !important; }
  .fin-lock input { font-size: 22px !important; }
  .gate-card input { font-size: 20px !important; }
  input[type="date"] { min-height: 42px; }

  /* Keyboard-safe modals: anchor near the top so the card (and its buttons)
     stay visible above the keyboard; scroll inside if needed. */
  .modal-overlay { align-items: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 44px); }
  .modal-card { max-height: calc(100dvh - 110px); overflow-y: auto; }

  .note-doc { padding: 2px 8px 24px; border-left: none; }
  .mobile-tab-bar {
    display: flex; position: fixed; align-items: center;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 8px; right: 8px;
    height: 60px;
    background: rgba(250,247,242,0.96);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 4px 20px rgba(44,26,14,0.12); z-index: 100;
  }
  .mobile-tab-inner {
    display: flex; align-items: center; justify-content: center;
    flex: 1; height: 100%; padding: 0 4px;
  }
  .mobile-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; border: none; background: transparent;
    cursor: pointer; padding: 5px 2px; color: var(--muted);
    border-radius: 13px; margin: 0 1px;
    transition: color 100ms, background 100ms; -webkit-tap-highlight-color: transparent;
    min-width: 0; max-width: 84px;
  }
  .mobile-tab.active { color: var(--accent-text); background: var(--accent-light); box-shadow: inset 0 1px 0 rgba(255,255,255,0.60), 0 1px 2px rgba(0,102,204,0.10); }
  .mobile-tab-icon { font-size: 18px; line-height: 1; }
  .mobile-tab-label { font-size: 10px; font-weight: 600; letter-spacing: 0; text-transform: none; }
  /* 44pt minimum touch targets on list rows */
  .item-swipe-body { min-height: 44px; }
  .trip-expense-body { min-height: 44px; }
  /* Edit mode rows in drawer */
  .mobile-edit-row {
    display: flex; align-items: center; padding: 8px 4px;
    border-bottom: 1px solid var(--line); gap: 4px;
  }
  .mobile-edit-row:last-child { border-bottom: none; }
  .h-greet h1 { font-size: 22px; }
  .h-greet { margin-bottom: 16px; }
  .page-head { flex-direction: column; align-items: flex-start; gap: 10px; }
  .page-head > div:last-child { width: 100%; flex-wrap: wrap; gap: 8px; }
  .fin-hero { grid-template-columns: 1fr; }
  .fin-twoup { grid-template-columns: 1fr; }
  .fin-big { font-size: 28px; letter-spacing: -0.6px; }
  .fin-sub-stack { font-size: 12px; gap: 4px; }
  .fin-row { grid-template-columns: 1fr 110px; gap: 6px; }
  .fin-row-pct, .fin-row-updated { display: none; }
  .fin-cards { grid-template-columns: 1fr; }
  .shop-layout { flex-direction: column; }
  .notes-layout { grid-template-columns: 1fr; }
  /* On mobile, list is shown by default; .notes-layout-doc hides the list and shows only the doc */
  .notes-layout .notes-list { display: flex; }
  .notes-layout.notes-layout-doc .notes-list { display: none; }
  .notes-mobile-back {
    display: flex; align-items: center; gap: 12px; padding: 8px 0 14px;
  }
  .notes-mobile-title {
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .note-list-handle { opacity: 0.5; }
}

/* Expense rows */

.trip-ccy-toggle { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; flex-shrink: 0; min-width: 0; }

.trip-ccy-btn.active { background: var(--grad-accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25); }

@media (max-width: 680px) {
  .trip-drag-handle { opacity: 0.5; }
  .trip-expense-body { background: rgba(250,247,242,1); }
  .trip-cat-grid { gap: 6px; }
  .trip-cat-btn { padding: 10px 4px; }
  .trip-cat-icon { font-size: 20px; }
  /* Stack amount + currency vertically so nothing overflows on iPhone */
  .trip-amount-row { flex-direction: column; }
  .trip-ccy-toggle { width: 100%; }
  .trip-ccy-btn { flex: 1; padding: 0 6px; font-size: 12px; }
  .trip-totals-row { flex-wrap: wrap; }
  .trip-rates-inline { width: 100%; margin-left: 0; }

.cat-breakdown { margin-top: 12px; }
.cat-bar {

/* ── Passcode gate (covers the app until the API URL is unlocked) ── */
#gate {
  position: fixed; inset: 0; z-index: 99999; background: var(--bg);
  display: grid; place-items: center; padding: 24px; box-sizing: border-box;
}
.gate-card {
  width: 340px; max-width: 100%; text-align: center; background: var(--paper);
  border: 1px solid var(--line); border-radius: 16px; padding: 36px 30px 26px;
  box-shadow: var(--shadow-card);
}
.gate-card.shake { animation: gateshake .4s; }
@keyframes gateshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.gate-mark { width: 54px; height: 54px; border-radius: 13px; margin: 0 auto 14px;

.gate-mark span:nth-child(2) { background: rgba(255,255,255,0.57); }
.gate-mark span:nth-child(3) { background: rgba(255,255,255,0.57); }
.gate-mark span:nth-child(4) { background: rgba(255,255,255,0.31); }
.gate-card h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 6px; }
.gate-card p  { color: var(--muted); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
.gate-card input {
  width: 100%; box-sizing: border-box; font-size: 20px; text-align: center; letter-spacing: 6px;
  padding: 12px; border: 1px solid var(--line-2); border-radius: 10px; outline: none;
  background: var(--bg); margin-bottom: 12px; color: var(--ink);
  font-family: var(--font-mono);
}
.gate-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,102,204,0.12); }

.gate-card button {
  width: 100%; padding: 12px; font-size: 14px; font-weight: 600; color: #fff;
  border: none; border-radius: 10px; cursor: pointer;
  background: var(--grad-accent); box-shadow: var(--bevel-accent);
}
.gate-card button:active { transform: scale(0.97); }
.gate-hint { font-size: 10px; color: var(--muted-2); letter-spacing: 0.8px; text-transform: uppercase; margin-top: 16px;
  font-family: var(--font-mono); }

<body>

<div id="gate">
  <form class="gate-card" id="gate-card" onsubmit="return __gateGo(event)">
    <div class="gate-mark"><span></span><span></span><span></span><span></span></div>
    <h1>Keeper</h1>
    <p>Enter the family passcode to unlock the dashboard on this device.</p>
    <input id="gate-pw" type="password" inputmode="text" autocomplete="current-password" placeholder="passcode">
    <button type="submit">Unlock</button>
    <div class="gate-hint">Remembered on this device after first unlock</div>
  </form>
</div>
<script>
// Gate runs BEFORE the app scripts: if the API URL is already stored, remove
// the overlay so the app (which reads localStorage at load) boots synced.
// On a fresh unlock we reload so the store re-evaluates with the URL present.
const __GATE_VAULT = { salt: "ncCgQeuDF2XwoB7bdDtcKw==", iv: "03CALX46wkiW2q/p", data: "afGXqgoaiBr+rMVbOWzRThEzpmZrsGJ6bbTP7/JRYDT3wBiDlR6eiuy8rQ6uUItfHTi6JStHFsRpEYsxsuMf+R+bBSkIUpoU/uKOYKiiGnQ9mZkwPd+pAOPCk3X4OkX+GF51U60BB5QyarZuXG8NfRXhWKQkfkB9BXlenaZwqGCPkUUJitDiUXH4PFOJ6nIXXnvIESRPJi7DYLztw3Jf/SVClk0p2Ep8O4kjRHlKjvDIASaN5A==" };
const __GATE_LS = 'studio.exec.url';

(function () {
  // Old bookmarks to the retired script.google.com URL land here via a
  // redirect that Google runs INSIDE its own wrapper iframe — leaving the
  // app framed under Google's banner at desktop width. Script-driven
  // top-navigation is blocked by Google's sandbox, but a user-tapped
  // target="_top" link is allowed — so offer exactly that and stop.
  if (window.top !== window.self) {
    try { window.top.location.href = 'https://romanems.github.io/keeper-dashboard/'; } catch (_) {}
    document.getElementById('gate').innerHTML =
      '<a href="https://romanems.github.io/keeper-dashboard/" target="_top" class="gate-card" ' +
      'style="display:block;text-decoration:none;color:inherit;font-size:16px;font-weight:600;">' +
      'Keeper has moved to a new address.<br><br>' +
      '<span style="color:#0066CC">Tap here to open it</span><br><br>' +
      '<span style="font-size:12px;font-weight:400;color:#8a7060">Then delete the old home-screen icon and add this page instead.</span></a>';
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(__GATE_LS); } catch (_) {}
  if (saved) document.getElementById('gate').remove();
})();

// ── iOS standalone keyboard guard ──────────────────────────────────────────
// When the keyboard opens, standalone iOS force-pans the whole app window
// (window scroll) even though the layout is overflow:hidden — pushing modal
// tops and headers off-screen and leaving the page shifted after the
// keyboard closes. Counter it: snap the window pan back to origin whenever
// the visual viewport changes, and instead reveal the focused field by
// scrolling the app's own inner scroller (.main, honoring scroll-padding).
(function () {
  if (!('visualViewport' in window)) return;
  let raf = null;
  function snap() {
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = null;
      if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
      const d = document.documentElement;
      if (d.scrollLeft) d.scrollLeft = 0;
      if (d.scrollTop) d.scrollTop = 0;
      const el = document.activeElement;
      if (el && el.closest && el.closest('.main') &&
          (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))) {
        const vh = window.visualViewport.height;
        const r = el.getBoundingClientRect();
        if (r.bottom > vh - 40 || r.top < 60) el.scrollIntoView({ block: 'center' });
      }
    });
  }
  window.visualViewport.addEventListener('resize', snap);
  window.visualViewport.addEventListener('scroll', snap);
  document.addEventListener('focusin', function () { setTimeout(snap, 350); });
  document.addEventListener('focusout', function () { setTimeout(snap, 100); });
})();

function __gateB64d(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function __gateGo(e) {
  e.preventDefault();
  const pw = document.getElementById('gate-pw');
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: __gateB64d(__GATE_VAULT.salt), iterations: 310000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: __gateB64d(__GATE_VAULT.iv) }, key, __gateB64d(__GATE_VAULT.data));
    const url = new TextDecoder().decode(plain);
    try { localStorage.setItem(__GATE_LS, url); } catch (_) {}
    window.location.reload();
  } catch (_) {
    const card = document.getElementById('gate-card');
    pw.classList.add('err'); card.classList.add('shake');
    pw.value = '';
    setTimeout(() => { pw.classList.remove('err'); card.classList.remove('shake'); }, 500);
  }
  return false;
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function save(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {}

// ── Remote sync API ───────────────────────────────────────────────────────
// The app is served from GitHub Pages; Apps Script is only its JSON API.
// The keyed API URL is decrypted by the passcode gate on first unlock and
// stored in localStorage — until then the app runs in local-only mode.
const API_URL = (() => {
  try { return localStorage.getItem('studio.exec.url') || ''; } catch { return ''; }
})();
const IS_SYNC = !!API_URL;

async function apiFetch(action, body) {
  const url = API_URL + '&action=' + action;
  // POST uses text/plain so the request stays "simple" (no CORS preflight,
  // which Apps Script cannot answer).
  const opts = body === undefined
    ? { method: 'GET' }
    : { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body };
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}

// ── Sync context ──────────────────────────────────────────────────────────
const StoreCtx = React.createContext(null);
const SyncCtx  = React.createContext('synced'); // 'synced' | 'saving' | 'loading' | 'error' | 'local'

function StoreProvider({ children }) {
  const [state,      setStateRaw]  = React.useState(() => load());
  const [syncStatus, setSyncStatus] = React.useState(IS_SYNC ? 'loading' : 'local');
  const debounceRef  = React.useRef(null);
  const latestState  = React.useRef(state);
  latestState.current = state;

  // Push to Google Sheet (debounced 1.2 s)
  function scheduleSync(data) {
    if (!IS_SYNC) return;
    clearTimeout(debounceRef.current);
    setSyncStatus('saving');
    debounceRef.current = setTimeout(() => {
      apiFetch('saveState', JSON.stringify(data))
        .then(res => setSyncStatus(res === 'ok' ? 'synced' : 'error'))
        .catch(() => setSyncStatus('error'));
    }, 1200);
  }

  // Pull latest from Google Sheet
  function fetchFromSheet() {
    if (!IS_SYNC) return;
    setSyncStatus('loading');
    apiFetch('getState')
      .then(json => {
        if (!json) { setSyncStatus('synced'); return; } // no remote state yet
        const remote = JSON.parse(json);
        const { financeData: _fd, ...cleanRemote } = remote;
        setStateRaw(() => {
          const merged = { ...SEED, ...cleanRemote, trips: cleanRemote.trips || [], tripsCollapsed: cleanRemote.tripsCollapsed || {}, homeHidden: cleanRemote.homeHidden || [], mobilePinned: cleanRemote.mobilePinned || null };
          save(merged);
          return merged;
        });
        setSyncStatus('synced');
      })
      .catch(() => setSyncStatus('error'));
  }

  // On mount: fetch from sheet, then re-fetch on tab focus
  React.useEffect(() => {
    if (!IS_SYNC) return;
    fetchFromSheet();
    const onVisible = () => { if (!document.hidden) fetchFromSheet(); };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, []);

  const setState = React.useCallback((updater) => {
    setStateRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      save(next);
      scheduleSync(next);
      return next;
    });
  }, []);

  return (
    <StoreCtx.Provider value={[state, setState]}>
      <SyncCtx.Provider value={syncStatus}>
        {children}
      </SyncCtx.Provider>
    </StoreCtx.Provider>
  );
}

function useStore()  { return React.useContext(StoreCtx); }
function useSyncStatus() { return React.useContext(SyncCtx); }

// ───── RTL detection ─────
const HEB_RE = /[\u0590-\u05FF\u0600-\u06FF]/;
function isRTL(str) {
  if (!str) return false;
  const m = str.match(/[\u0590-\u06FF\u0041-\u007AA-Za-z]/g);
  if (!m) return false;
  let rtl = 0, ltr = 0;
  for (let i = 0; i < Math.min(m.length, 8); i++) {
    if (HEB_RE.test(m[i])) rtl++; else ltr++;
  }
  return rtl > ltr;
}

// ───── Date helpers ─────
function today() { return iso(new Date()); }
function daysUntil(dueIso) {
  if (!dueIso) return null;
  const d = new Date(dueIso + 'T00:00:00');
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

  const n = daysUntil(due);
  if (n === null) return null;
  if (n < 0) return n === -1 ? 'Yesterday' : `${-n}d overdue`;
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n < 7) return `In ${n}d`;
  const d = new Date(due + 'T00:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function dueBucket(due) {
  const n = daysUntil(due);
  if (n === null) return 'someday';
  if (n <= 0) return 'today';
  return 'upcoming';
}

// ───── Drag-to-reorder — touch + pointer dual path ─────
// Pointer events alone don't fire reliably on iOS Safari for drag gestures.
// We use touch events directly for iOS and pointer events for desktop/mouse.
function useReorder(list, onReorder) {
  const [draggingId, setDraggingId] = React.useState(null);
  const [overId, setOverId] = React.useState(null);

  const listRef    = React.useRef(list);
  const overIdRef  = React.useRef(null);
  const reorderRef = React.useRef(onReorder);
  const stateRef   = React.useRef({ id: null, startY: 0, startX: 0, rows: [] });

  listRef.current    = list;
  reorderRef.current = onReorder;
  overIdRef.current  = overId;

  const measure = React.useCallback(() => {
    const rows = [];
    listRef.current.forEach((item) => {
      const el = document.querySelector(`[data-reorder-id="${item.id}"]`);
      if (el) {
        const r = el.getBoundingClientRect();
        rows.push({ id: item.id, mid: r.top + r.height / 2 });
      }
    });
    stateRef.current.rows = rows;
  }, []);

  const updateOver = React.useCallback((clientY) => {
    const st = stateRef.current;
    if (!st.id) return;
    let closest = null, closestDist = Infinity;
    for (const row of st.rows) {
      const d = Math.abs(clientY - row.mid);
      if (d < closestDist) { closestDist = d; closest = row.id; }
    }
    if (closest && closest !== overIdRef.current) {
      overIdRef.current = closest;
      setOverId(closest);
    }
  }, []);

  const commit = React.useCallback(() => {
    const st   = stateRef.current;
    const over = overIdRef.current;
    if (st.id && over && over !== st.id) {
      const from = listRef.current.findIndex((x) => x.id === st.id);
      const to   = listRef.current.findIndex((x) => x.id === over);
      if (from !== -1 && to !== -1) {
        const next = [...listRef.current];
        const [moved] = next.splice(from, 1);
        next.splice(to, 0, moved);
        reorderRef.current(next);
      }
    }
    st.id = null;
    overIdRef.current = null;
    setDraggingId(null);
    setOverId(null);
    document.body.style.userSelect = '';
  }, []);

  // ── Desktop: pointer events (mouse, pen) ──
  const onPointerMove = React.useCallback((e) => {
    const st = stateRef.current;
    if (!st.id) return;
    if (Math.abs(e.clientY - st.startY) < 4 && Math.abs(e.clientX - st.startX) < 4) return;
    e.preventDefault();
    updateOver(e.clientY);
  }, [updateOver]);

  const onPointerUp = React.useCallback(() => {
    commit();
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
  }, [commit, onPointerMove]);

  // ── iOS Safari: touch events ──
  const onTouchMoveDoc = React.useCallback((e) => {
    const st = stateRef.current;
    if (!st.id) return;
    const t = e.touches[0];
    if (Math.abs(t.clientY - st.startY) < 4 && Math.abs(t.clientX - st.startX) < 4) return;
    e.preventDefault();
    updateOver(t.clientY);
  }, [updateOver]);

  const onTouchEndDoc = React.useCallback(() => {
    commit();
    document.removeEventListener('touchmove', onTouchMoveDoc);
    document.removeEventListener('touchend', onTouchEndDoc);
  }, [commit, onTouchMoveDoc]);

  const getHandleProps = React.useCallback((id) => ({
    'data-reorder-handle': true,
    // Desktop path
    onPointerDown: (e) => {
      if (e.pointerType === 'touch') return; // handled by onTouchStart below
      e.preventDefault();
      e.stopPropagation();
      stateRef.current = { id, startY: e.clientY, startX: e.clientX, rows: [] };
      overIdRef.current = null;
      setDraggingId(id);
      setOverId(null);
      measure();
      document.body.style.userSelect = 'none';
      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp);
    },
    // iOS path
    onTouchStart: (e) => {
      e.stopPropagation();
      const t = e.touches[0];
      stateRef.current = { id, startY: t.clientY, startX: t.clientX, rows: [] };
      overIdRef.current = null;
      setDraggingId(id);
      setOverId(null);
      measure();
      document.body.style.userSelect = 'none';
      document.addEventListener('touchmove', onTouchMoveDoc, { passive: false });
      document.addEventListener('touchend', onTouchEndDoc);
    },
  }), [measure, onPointerMove, onPointerUp, onTouchMoveDoc, onTouchEndDoc]);

  return { getHandleProps, dragState: { draggingId, overId } };
}

// ───── Misc helpers ─────
function uid() { return Math.random().toString(36).slice(2, 9); }
function fmtDate(d = new Date()) {
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
function relTime(ts) {
  const diff = (Date.now() - ts) / 86400000;
  if (diff < 1) return 'today';
  if (diff < 2) return 'yesterday';
  if (diff < 7) return `${Math.floor(diff)}d ago`;
  if (diff < 30) return `${Math.floor(diff / 7)}w ago`;
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
